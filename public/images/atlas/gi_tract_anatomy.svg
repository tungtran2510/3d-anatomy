<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="giBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Stomach Coral Gradient -->
    <linearGradient id="stomachGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Duodenum Yellowish Gradient -->
    <linearGradient id="duoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Colon Mauve/Brown Gradient -->
    <linearGradient id="colonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#giBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Title Badge -->
  <g transform="translate(24, 24)">
    <rect width="210" height="26" rx="6" fill="#e11d48" fill-opacity="0.3" stroke="#fb7185" stroke-width="1" />
    <text x="12" y="17" fill="#fb7185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11.5" font-weight="700" letter-spacing="0.5">HỆ TIÊU HÓA &amp; ỐNG TIÊU HÓA</text>
  </g>
  <text x="24" y="70" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="16" font-weight="700">Giải Phẫu Ống Tiêu Hóa Liên Tục &amp; Ruột Thừa</text>
  <text x="24" y="88" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11.5">Chuỗi liên tục: Thực quản → Dạ dày → Tá tràng → Ruột non → Đại tràng &amp; Ruột thừa</text>

  <!-- Central GI Anatomy Graphic -->
  <g transform="translate(300, 205)">
    <!-- 1. Stomach (Hình chữ J đặc trưng) -->
    <!-- Esophagus entrance (Tâm vị) to Pylorus (Môn vị) -->
    <path d="M-60,-95 L-55,-65 C-55,-40 -95,-20 -95,20 C-95,65 -45,85 0,85 C35,85 65,70 65,45 C65,25 45,15 25,20 C5,25 -25,25 -45,0 C-55,-15 -45,-45 -45,-65 Z" 
          fill="url(#stomachGrad)" stroke="#be123c" stroke-width="1.5" opacity="0.95"/>
    <text x="-40" y="30" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11.5" font-weight="800">DẠ DÀY</text>

    <!-- 2. Duodenum C-loop (Khung tá tràng ôm đầu tụy) -->
    <path d="M65,45 C85,50 110,65 110,95 C110,125 75,140 35,140" fill="none" stroke="url(#duoGrad)" stroke-width="18" stroke-linecap="round"/>
    <text x="125" y="100" fill="#facc15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10.5" font-weight="700">TÁ TRÀNG</text>

    <!-- 3. Large Intestine Outline (Khung đại tràng hình chữ U ngược) -->
    <path d="M-150,135 L-150,-10 C-150,-35 -130,-45 -90,-45 L90,-45 C130,-45 150,-35 150,-10 L150,135" 
          fill="none" stroke="url(#colonGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.45" stroke-dasharray="8 4"/>

    <!-- 4. Cecum & Vermiform Appendix (Hồi manh tràng & Ruột thừa góc phần tư dưới phải) -->
    <ellipse cx="-150" cy="125" rx="18" ry="22" fill="#7e22ce" stroke="#c084fc" stroke-width="1.5"/>
    <!-- Ruột thừa hình giun -->
    <path d="M-155,145 C-165,155 -170,170 -160,180" fill="none" stroke="#ef4444" stroke-width="5.5" stroke-linecap="round"/>
    <circle cx="-160" cy="180" r="3.5" fill="#f87171">
      <animate attributeName="r" values="3;5;3" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="-165" y="196" text-anchor="middle" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="800">RUỘT THỪA</text>
  </g>

  <!-- Left Callout: Dạ dày & Môn vị -->
  <g transform="translate(24, 125)">
    <rect width="165" height="98" rx="8" fill="#1e293b" fill-opacity="0.85" stroke="#fb7185" stroke-width="1.2" />
    <text x="10" y="20" fill="#fb7185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="700">Dạ Dày &amp; Cơ Thắt Môn Vị</text>
    <text x="10" y="38" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10.5">• Dung tích chứa 1.5 - 2 Lít</text>
    <text x="10" y="54" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10.5">• Acid pH 1.5 - 2 diệt khuẩn</text>
    <text x="10" y="72" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10.5">• 3 lớp cơ (dọc, vòng, chéo)</text>
    <text x="10" y="88" fill="#f43f5e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9.5">Vị trí hay viêm: Hang môn vị</text>
    <line x1="165" y1="50" x2="230" y2="210" stroke="#fb7185" stroke-width="1.2" stroke-dasharray="3 3"/>
  </g>

  <!-- Right Callout: Ruột thừa & Điểm McBurney -->
  <g transform="translate(411, 125)">
    <rect width="165" height="98" rx="8" fill="#1e293b" fill-opacity="0.85" stroke="#ef4444" stroke-width="1.2" />
    <text x="10" y="20" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="700">Ruột Thừa (Appendix)</text>
    <text x="10" y="38" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10.5">• Dài 6 - 9 cm manh tràng</text>
    <text x="10" y="54" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10.5">• Chứa nhiều mô bạch huyết</text>
    <text x="10" y="72" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10.5" font-weight="700">• Điểm đau McBurney 1/3</text>
    <text x="10" y="88" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9.5">Nối rốn với gai chậu trước trên</text>
    <line x1="0" y1="75" x2="-260" y2="380" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="3 3"/>
  </g>

  <!-- Bottom Insight Bar -->
  <g transform="translate(24, 328)">
    <rect width="552" height="34" rx="7" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="16" y="21" fill="#fb7185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11.5" font-weight="700">CHẨN ĐOÁN LÂM SÀNG:</text>
    <text x="168" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11">Cơn đau chuyển từ thượng vị quanh rốn xuống hố chậu phải là dấu hiệu kinh điển của Viêm ruột thừa.</text>
  </g>
</svg>

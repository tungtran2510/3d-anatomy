<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="respPathoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04121a" />
      <stop offset="100%" stop-color="#082032" />
    </linearGradient>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#respPathoBg)" stroke="#0e7490" stroke-width="1.5" />

  <!-- Title Badge -->
  <g transform="translate(24, 22)">
    <rect width="235" height="26" rx="6" fill="#be123c" fill-opacity="0.35" stroke="#f43f5e" stroke-width="1" />
    <text x="12" y="17" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="700" letter-spacing="0.5">⚠️ BỆNH HỌC KHÍ ĐẠO &amp; COPD</text>
  </g>
  <text x="24" y="68" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="15.5" font-weight="700">4 Giai Đoạn Co Thắt Hen Phế Quản &amp; Tắc Khí Đạo</text>
  <text x="24" y="86" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11">Từ đường thở thông thoáng đến co thắt phế quản, bít tắc nhầy và suy hô hấp cấp</text>

  <!-- 4 Step Boxes Across Screen -->
  <!-- Level 0: Bình thường -->
  <g transform="translate(24, 115)">
    <rect width="130" height="225" rx="10" fill="#0f172a" stroke="#0e7490" stroke-width="1.5" />
    <rect width="130" height="28" rx="8" fill="#155e75" />
    <text x="65" y="18" fill="#a5f3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10.5" font-weight="800" text-anchor="middle">CẤP 0: BÌNH THƯỜNG</text>

    <!-- Lumen Open Icon -->
    <circle cx="65" cy="72" r="32" fill="#082f49" stroke="#38bdf8" stroke-width="2" />
    <circle cx="65" cy="72" r="24" fill="#0284c7" fill-opacity="0.4" />
    <text x="65" y="76" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9.5" font-weight="800" text-anchor="middle">RỘNG RÃI</text>

    <text x="65" y="125" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="700" text-anchor="middle">Khí đạo thông thoáng</text>
    <text x="12" y="145" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="8.5">• Cơ trơn phế quản dãn</text>
    <text x="12" y="160" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="8.5">• Niêm mạc mỏng sạch</text>
    <text x="12" y="175" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="8.5">• SpO2 98–100%</text>
    <rect x="12" y="195" width="106" height="20" rx="4" fill="#166534" fill-opacity="0.3" stroke="#22c55e" stroke-width="1" />
    <text x="65" y="209" fill="#86efac" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" font-weight="700" text-anchor="middle">Thở êm dịu</text>
  </g>

  <!-- Level 1: Co thắt nhẹ -->
  <g transform="translate(165, 115)">
    <rect width="130" height="225" rx="10" fill="#0f172a" stroke="#ca8a04" stroke-width="1.5" />
    <rect width="130" height="28" rx="8" fill="#713f12" />
    <text x="65" y="18" fill="#fef08a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10.5" font-weight="800" text-anchor="middle">CẤP 1: CO THẮT NHẸ</text>

    <!-- Lumen Narrowing Icon -->
    <circle cx="65" cy="72" r="32" fill="#082f49" stroke="#facc15" stroke-width="3" stroke-dasharray="10,3" />
    <circle cx="65" cy="72" r="17" fill="#ca8a04" fill-opacity="0.5" />
    <text x="65" y="76" fill="#fef08a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" font-weight="800" text-anchor="middle">HẸP LÒNG</text>

    <text x="65" y="125" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="700" text-anchor="middle">Co thắt cơ trơn</text>
    <text x="12" y="145" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="8.5">• Phản ứng dị nguyên</text>
    <text x="12" y="160" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="8.5">• Thở rít nhẹ thì thở ra</text>
    <text x="12" y="175" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="8.5">• SpO2 95–97%</text>
    <rect x="12" y="195" width="106" height="20" rx="4" fill="#854d0e" fill-opacity="0.3" stroke="#eab308" stroke-width="1" />
    <text x="65" y="209" fill="#fef08a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" font-weight="700" text-anchor="middle">Dùng thuốc xịt</text>
  </g>

  <!-- Level 2: Tắc đờm nhầy phù nề -->
  <g transform="translate(306, 115)">
    <rect width="130" height="225" rx="10" fill="#0f172a" stroke="#ea580c" stroke-width="1.5" />
    <rect width="130" height="28" rx="8" fill="#7c2d12" />
    <text x="65" y="18" fill="#fed7aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10.5" font-weight="800" text-anchor="middle">CẤP 2: TẮC NHẦY ĐỜM</text>

    <!-- Lumen Mucus Plug Icon -->
    <circle cx="65" cy="72" r="32" fill="#7c2d12" stroke="#ea580c" stroke-width="4" />
    <circle cx="65" cy="72" r="10" fill="#f97316" />
    <circle cx="65" cy="72" r="5" fill="#ffffff" />
    <text x="65" y="76" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="8" font-weight="900" text-anchor="middle">NÚT NHẦY</text>

    <text x="65" y="125" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="700" text-anchor="middle">Phù nề &amp; nút đờm</text>
    <text x="12" y="145" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="8.5">• Tiết nhầy đặc quánh</text>
    <text x="12" y="160" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="8.5">• Bẫy khí trong phổi</text>
    <text x="12" y="175" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="8.5">• SpO2 90–93%</text>
    <rect x="12" y="195" width="106" height="20" rx="4" fill="#9a3412" fill-opacity="0.3" stroke="#f97316" stroke-width="1" />
    <text x="65" y="209" fill="#fed7aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" font-weight="700" text-anchor="middle">Cần Corticoid</text>
  </g>

  <!-- Level 3: Xẹp phế nang & Suy hô hấp -->
  <g transform="translate(447, 115)">
    <rect width="130" height="225" rx="10" fill="#0f172a" stroke="#dc2626" stroke-width="2" />
    <rect width="130" height="28" rx="8" fill="#991b1b" />
    <text x="65" y="18" fill="#fecaca" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="900" text-anchor="middle">CẤP 3: SUY HÔ HẤP</text>

    <!-- Collapsed Alveoli Icon -->
    <circle cx="65" cy="72" r="32" fill="#450a0a" stroke="#ef4444" stroke-width="4" />
    <line x1="45" y1="72" x2="85" y2="72" stroke="#ef4444" stroke-width="4" />
    <text x="65" y="64" fill="#fecaca" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="8.5" font-weight="900" text-anchor="middle">BÍT TẮC</text>

    <text x="65" y="125" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="700" text-anchor="middle">Xẹp phế nang lan tỏa</text>
    <text x="12" y="145" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="8.5">• Giảm oxy máu nặng</text>
    <text x="12" y="160" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="8.5">• SpO2 &lt; 85%, tím tái</text>
    <text x="12" y="175" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="8.5">• Toan hô hấp đe dọa</text>
    <rect x="12" y="195" width="106" height="20" rx="4" fill="#b91c1c" fill-opacity="0.4" stroke="#ef4444" stroke-width="1" />
    <text x="65" y="209" fill="#fecaca" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" font-weight="800" text-anchor="middle">Thở máy cấp cứu</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Nucleus Pulposus Radial Gel Glow -->
    <radialGradient id="nucleusGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.9" />
      <stop offset="80%" stop-color="#0369a1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#075985" stop-opacity="0.4" />
    </radialGradient>

    <!-- Anulus Fibrosus Lamellar Gradients -->
    <linearGradient id="anulusGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#1e40af" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#172554" stop-opacity="0.8" />
    </linearGradient>
    
    <!-- Nerve Root Glow -->
    <linearGradient id="nerveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="600" height="380" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Title Badge -->
  <g transform="translate(24, 28)">
    <rect width="210" height="26" rx="6" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1" />
    <text x="12" y="17" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="700" letter-spacing="0.5">LÁT CẮT CẤU TẠO ĐA TẦNG</text>
  </g>
  <text x="24" y="74" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="16" font-weight="700">Mặt Cắt Ngang Đĩa Đệm Gian Đốt Sống</text>
  <text x="24" y="92" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12">Cấu tạo vi thể gồm 3 thành phần liên kết sinh học</text>

  <!-- Central Disc Anatomy Group -->
  <g transform="translate(260, 230)">
    <!-- Vertebral Body Outline Behind -->
    <path d="M-170,-40 C-170,-110 -100,-135 0,-135 C100,-135 170,-110 170,-40 C170,40 120,85 0,85 C-120,85 -170,40 -170,-40 Z" 
          fill="#1e293b" fill-opacity="0.4" stroke="#475569" stroke-dasharray="4 3" stroke-width="1.5"/>

    <!-- ANULUS FIBROSUS (15-25 Concentric Lamellae Rings) -->
    <!-- Layer 1 (Outer) -->
    <path d="M-150,-35 C-150,-95 -90,-115 0,-115 C90,-115 150,-95 150,-35 C150,30 100,70 0,70 C-100,70 -150,30 -150,-35 Z" 
          fill="url(#anulusGrad)" stroke="#60a5fa" stroke-width="2"/>

    <!-- Layer 2 -->
    <path d="M-135,-33 C-135,-85 -80,-102 0,-102 C80,-102 135,-85 135,-33 C135,24 90,60 0,60 C-90,60 -135,24 -135,-33 Z" 
          fill="none" stroke="#3b82f6" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="6 3"/>

    <!-- Layer 3 -->
    <path d="M-120,-30 C-120,-75 -70,-90 0,-90 C70,-90 120,-75 120,-30 C120,18 80,50 0,50 C-80,50 -120,18 -120,-30 Z" 
          fill="none" stroke="#2563eb" stroke-opacity="0.5" stroke-width="1.5"/>

    <!-- Layer 4 -->
    <path d="M-105,-28 C-105,-65 -60,-78 0,-78 C60,-78 105,-65 105,-28 C105,14 70,42 0,42 C-70,42 -105,14 -105,-28 Z" 
          fill="none" stroke="#1d4ed8" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="5 2"/>

    <!-- Layer 5 (Transition Zone) -->
    <path d="M-90,-25 C-90,-55 -50,-66 0,-66 C50,-66 90,-55 90,-25 C90,10 60,34 0,34 C-60,34 -90,10 -90,-25 Z" 
          fill="#0c4a6e" fill-opacity="0.5" stroke="#0284c7" stroke-width="1.5"/>

    <!-- NUCLEUS PULPOSUS (Hydrogel Center) -->
    <ellipse cx="0" cy="-22" rx="65" ry="36" fill="url(#nucleusGrad)" stroke="#38bdf8" stroke-width="2.5"/>
    <ellipse cx="-15" cy="-26" rx="20" ry="10" fill="#bae6fd" fill-opacity="0.4" />

    <!-- Nucleus Pulposus Water Text -->
    <text x="0" y="-26" fill="#f0f9ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="700" text-anchor="middle">NHÂN NHẦY</text>
    <text x="0" y="-12" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" text-anchor="middle">80% Nước &amp; Aggrecan</text>

    <!-- Spinal Cord &amp; Nerve Root (Posterior Relation) -->
    <!-- Spinal Canal Arc (Phía sau) -->
    <path d="M-80,85 C-40,120 40,120 80,85" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="0" y="118" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" text-anchor="middle">Ống sống (Chứa tủy gai)</text>

    <!-- Nerve Roots Exit -->
    <path d="M60,65 C95,85 130,95 160,110" fill="none" stroke="url(#nerveGrad)" stroke-width="4" stroke-linecap="round"/>
    <path d="M-60,65 C-95,85 -130,95 -160,110" fill="none" stroke="url(#nerveGrad)" stroke-width="4" stroke-linecap="round"/>

    <!-- Pointer &amp; Callouts -->
    <!-- 1. Vòng sợi ngoài -->
    <line x1="-140" y1="-50" x2="-200" y2="-100" stroke="#60a5fa" stroke-width="1.5" />
    <circle cx="-140" cy="-50" r="3.5" fill="#60a5fa" />
    <circle cx="-200" cy="-100" r="2.5" fill="#60a5fa" />
    <g transform="translate(-250, -135)">
      <rect width="135" height="38" rx="6" fill="#1e293b" fill-opacity="0.95" stroke="#3b82f6" stroke-width="1"/>
      <text x="8" y="16" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="700">1. Vòng sợi ngoài</text>
      <text x="8" y="29" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9">15-25 lá collagen góc 30°</text>
    </g>

    <!-- 2. Nhân nhầy trung tâm -->
    <line x1="20" y1="-35" x2="160" y2="-100" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="20" cy="-35" r="3.5" fill="#38bdf8" />
    <circle cx="160" cy="-100" r="2.5" fill="#38bdf8" />
    <g transform="translate(140, -135)">
      <rect width="145" height="38" rx="6" fill="#1e293b" fill-opacity="0.95" stroke="#0ea5e9" stroke-width="1"/>
      <text x="8" y="16" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="700">2. Nhân nhầy (Nucleus)</text>
      <text x="8" y="29" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9">Lõi gel thủy lực chịu nén</text>
    </g>

    <!-- 3. Rễ thần kinh thoát ra -->
    <line x1="120" y1="90" x2="175" y2="45" stroke="#facc15" stroke-width="1.5" />
    <circle cx="120" cy="90" r="3.5" fill="#facc15" />
    <g transform="translate(145, 10)">
      <rect width="135" height="36" rx="6" fill="#1e293b" fill-opacity="0.95" stroke="#eab308" stroke-width="1"/>
      <text x="8" y="15" fill="#fde047" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="700">3. Rễ thần kinh tủy</text>
      <text x="8" y="28" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9">Đi qua lỗ gian đốt sống</text>
    </g>
  </g>
</svg>

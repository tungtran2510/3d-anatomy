<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="cataractBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081426" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Stage Gradients -->
    <linearGradient id="catStage0" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="catStage1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#854d0e" />
      <stop offset="100%" stop-color="#422006" />
    </linearGradient>
    <linearGradient id="catStage2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9a3412" />
      <stop offset="100%" stop-color="#431407" />
    </linearGradient>
    <linearGradient id="catStage3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#881337" />
      <stop offset="100%" stop-color="#4c0519" />
    </linearGradient>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#cataractBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Badge Header -->
  <g transform="translate(24, 24)">
    <rect width="250" height="26" rx="6" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1" />
    <text x="12" y="17" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11.5" font-weight="700" letter-spacing="0.5">TIẾN TRIỂN BỆNH HỌC MẮT &amp; THỊ LỰC</text>
  </g>
  <text x="24" y="70" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="16" font-weight="700">4 Giai Đoạn Đục Thủy Tinh Thể (Cataract Progression)</text>
  <text x="24" y="88" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11.5">Sự thoái hóa và vón cục protein tinh thể làm mờ dần đường truyền ánh sáng tới võng mạc</text>

  <!-- 4 Columns -->
  <!-- STAGE 0: TRONG SUỐT -->
  <g transform="translate(20, 110)">
    <rect width="130" height="245" rx="10" fill="url(#catStage0)" stroke="#059669" stroke-width="1.2" />
    <rect x="8" y="10" width="70" height="20" rx="4" fill="#059669" />
    <text x="14" y="24" fill="#ffffff" font-size="10" font-weight="700">GIAI ĐOẠN 1</text>
    <text x="10" y="48" fill="#34d399" font-size="11" font-weight="700">Trong Suốt</text>

    <!-- Lens Graphic -->
    <g transform="translate(65, 95)">
      <ellipse cx="0" cy="0" rx="14" ry="28" fill="#38bdf8" fill-opacity="0.25" stroke="#38bdf8" stroke-width="2"/>
      <!-- Crisp Light Beam Passing Through -->
      <line x1="-35" y1="0" x2="35" y2="0" stroke="#fef08a" stroke-width="2" />
    </g>

    <text x="10" y="152" fill="#e2e8f0" font-size="9.5" font-weight="600">• Tinh thể trong vắt</text>
    <text x="10" y="168" fill="#cbd5e1" font-size="9">• Thị lực 10/10</text>
    <text x="10" y="184" fill="#cbd5e1" font-size="9">• Nhìn màu sắc chuẩn xác</text>
    <rect x="8" y="215" width="114" height="20" rx="4" fill="#065f46" />
    <text x="32" y="229" fill="#a7f3d0" font-size="9.5" font-weight="700">Khỏe mạnh</text>
  </g>

  <!-- STAGE 1: ĐỤC SỚM (BẮT ĐẦU) -->
  <g transform="translate(162, 110)">
    <rect width="130" height="245" rx="10" fill="url(#catStage1)" stroke="#ca8a04" stroke-width="1.2" />
    <rect x="8" y="10" width="70" height="20" rx="4" fill="#ca8a04" />
    <text x="14" y="24" fill="#ffffff" font-size="10" font-weight="700">GIAI ĐOẠN 2</text>
    <text x="10" y="48" fill="#facc15" font-size="11" font-weight="700">Đục Sớm / Đục Vỏ</text>

    <!-- Lens Graphic with Small Opacity Cloud -->
    <g transform="translate(65, 95)">
      <ellipse cx="0" cy="0" rx="14" ry="28" fill="#38bdf8" fill-opacity="0.3" stroke="#facc15" stroke-width="2"/>
      <ellipse cx="-4" cy="-8" rx="6" ry="6" fill="#fef08a" fill-opacity="0.6"/>
      <!-- Slightly scattered light -->
      <line x1="-35" y1="0" x2="0" y2="0" stroke="#fef08a" stroke-width="2" />
      <line x1="0" y1="0" x2="35" y2="0" stroke="#fef08a" stroke-width="1.5" stroke-dasharray="3 1" />
    </g>

    <text x="10" y="152" fill="#e2e8f0" font-size="9.5" font-weight="600">• Vẩn đục nhẹ ở rìa</text>
    <text x="10" y="168" fill="#cbd5e1" font-size="9">• Chói mắt khi đi nắng</text>
    <text x="10" y="184" fill="#cbd5e1" font-size="9">• Thường xuyên đổi kính</text>
    <rect x="8" y="215" width="114" height="20" rx="4" fill="#713f12" />
    <text x="25" y="229" fill="#fde047" font-size="9.5" font-weight="700">Theo dõi định kỳ</text>
  </g>

  <!-- STAGE 2: ĐỤC TIẾN TRIỂN (NHÂN) -->
  <g transform="translate(304, 110)">
    <rect width="130" height="245" rx="10" fill="url(#catStage2)" stroke="#ea580c" stroke-width="1.2" />
    <rect x="8" y="10" width="70" height="20" rx="4" fill="#ea580c" />
    <text x="14" y="24" fill="#ffffff" font-size="10" font-weight="700">GIAI ĐOẠN 3</text>
    <text x="10" y="48" fill="#fb923c" font-size="11" font-weight="700">Đục Nhân Vàng Nâu</text>

    <!-- Lens Graphic with Dense Center -->
    <g transform="translate(65, 95)">
      <ellipse cx="0" cy="0" rx="14" ry="28" fill="#b45309" fill-opacity="0.6" stroke="#ea580c" stroke-width="2"/>
      <ellipse cx="0" cy="0" rx="9" ry="16" fill="#f59e0b" fill-opacity="0.8"/>
      <!-- Scattered light -->
      <line x1="-35" y1="0" x2="-8" y2="0" stroke="#fef08a" stroke-width="2" />
      <line x1="8" y1="0" x2="35" y2="0" stroke="#fef08a" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.5"/>
    </g>

    <text x="10" y="152" fill="#e2e8f0" font-size="9.5" font-weight="600">• Nhìn mờ như qua sương</text>
    <text x="10" y="168" fill="#cbd5e1" font-size="9">• Giảm thị lực ban đêm</text>
    <text x="10" y="184" fill="#cbd5e1" font-size="9">• Nhìn một vật thành hai</text>
    <rect x="8" y="215" width="114" height="20" rx="4" fill="#7c2d12" />
    <text x="24" y="229" fill="#fdba74" font-size="9.5" font-weight="700">Khám chỉ định mổ</text>
  </g>

  <!-- STAGE 3: ĐỤC CHÍN TOÀN BỘ -->
  <g transform="translate(446, 110)">
    <rect width="134" height="245" rx="10" fill="url(#catStage3)" stroke="#e11d48" stroke-width="1.2" />
    <rect x="8" y="10" width="70" height="20" rx="4" fill="#e11d48" />
    <text x="14" y="24" fill="#ffffff" font-size="10" font-weight="700">GIAI ĐOẠN 4</text>
    <text x="10" y="48" fill="#fda4af" font-size="11" font-weight="700">Đục Chín (Mù Lòa)</text>

    <!-- Solid White Lens -->
    <g transform="translate(67, 95)">
      <ellipse cx="0" cy="0" rx="14" ry="28" fill="#f8fafc" stroke="#e11d48" stroke-width="2"/>
      <ellipse cx="0" cy="0" rx="11" ry="22" fill="#e2e8f0" />
      <!-- Blocked Light Ray -->
      <line x1="-35" y1="0" x2="-14" y2="0" stroke="#fef08a" stroke-width="2" />
    </g>

    <text x="10" y="152" fill="#e2e8f0" font-size="9.5" font-weight="600">• Đồng tử trắng đục</text>
    <text x="10" y="168" fill="#cbd5e1" font-size="9">• Chỉ còn nhận biết sáng/tối</text>
    <text x="10" y="184" fill="#cbd5e1" font-size="9">• Nguy cơ tăng nhãn áp Glaucoma</text>
    <rect x="8" y="215" width="118" height="20" rx="4" fill="#4c0519" />
    <text x="24" y="229" fill="#fda4af" font-size="9.5" font-weight="700">Phẫu thuật Phaco</text>
  </g>
</svg>

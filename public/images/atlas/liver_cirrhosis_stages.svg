<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="cirrhosisBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09131d" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>

    <!-- Stage Gradients -->
    <linearGradient id="cStage0" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="cStage1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#854d0e" />
      <stop offset="100%" stop-color="#422006" />
    </linearGradient>
    <linearGradient id="cStage2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9a3412" />
      <stop offset="100%" stop-color="#431407" />
    </linearGradient>
    <linearGradient id="cStage3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#881337" />
      <stop offset="100%" stop-color="#4c0519" />
    </linearGradient>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#cirrhosisBg)" stroke="#27272a" stroke-width="1.5" />

  <!-- Badge Header -->
  <g transform="translate(24, 24)">
    <rect width="250" height="26" rx="6" fill="#991b1b" fill-opacity="0.3" stroke="#ef4444" stroke-width="1" />
    <text x="12" y="17" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11.5" font-weight="700" letter-spacing="0.5">TIẾN TRIỂN BỆNH HỌC GAN MẬT</text>
  </g>
  <text x="24" y="70" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="16" font-weight="700">4 Giai Đoạn Tiến Triển: Gan Nhiễm Mỡ Đến Xơ Gan</text>
  <text x="24" y="88" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11.5">Sự tích tụ hạt mỡ vi thể, lắng đọng dải xơ collagen đến hình thành nốt tái tạo đảo lộn cấu trúc</text>

  <!-- 4 Columns -->
  <!-- STAGE 0: GAN KHỎE MẠNH -->
  <g transform="translate(20, 110)">
    <rect width="130" height="245" rx="10" fill="url(#cStage0)" stroke="#059669" stroke-width="1.2" />
    <rect x="8" y="10" width="70" height="20" rx="4" fill="#059669" />
    <text x="14" y="24" fill="#ffffff" font-size="10" font-weight="700">GIAI ĐOẠN 1</text>
    <text x="10" y="48" fill="#34d399" font-size="11" font-weight="700">Gan Khỏe Mạnh</text>

    <!-- Liver Organ Graphic -->
    <g transform="translate(65, 95)">
      <path d="M-30,-15 C-15,-25 15,-25 30,-10 C35,15 20,25 0,25 C-20,25 -35,10 -30,-15 Z" fill="#991b1b" stroke="#ef4444" stroke-width="2"/>
    </g>

    <text x="10" y="152" fill="#e2e8f0" font-size="9.5" font-weight="600">• Bề mặt nhẵn bóng</text>
    <text x="10" y="168" fill="#cbd5e1" font-size="9">• Mềm mại đàn hồi</text>
    <text x="10" y="184" fill="#cbd5e1" font-size="9">• Men gan AST/ALT chuẩn</text>
    <rect x="8" y="215" width="114" height="20" rx="4" fill="#065f46" />
    <text x="32" y="229" fill="#a7f3d0" font-size="9.5" font-weight="700">Khỏe mạnh</text>
  </g>

  <!-- STAGE 1: GAN NHIỄM MỠ (STEATOSIS) -->
  <g transform="translate(162, 110)">
    <rect width="130" height="245" rx="10" fill="url(#cStage1)" stroke="#ca8a04" stroke-width="1.2" />
    <rect x="8" y="10" width="70" height="20" rx="4" fill="#ca8a04" />
    <text x="14" y="24" fill="#ffffff" font-size="10" font-weight="700">GIAI ĐOẠN 2</text>
    <text x="10" y="48" fill="#facc15" font-size="11" font-weight="700">Gan Nhiễm Mỡ</text>

    <!-- Liver with Fat Droplets -->
    <g transform="translate(65, 95)">
      <path d="M-30,-15 C-15,-25 15,-25 30,-10 C35,15 20,25 0,25 C-20,25 -35,10 -30,-15 Z" fill="#b45309" stroke="#f59e0b" stroke-width="2"/>
      <!-- Fat droplet dots -->
      <circle cx="-12" cy="0" r="3.5" fill="#fef08a" />
      <circle cx="8" cy="-5" r="4" fill="#fef08a" />
      <circle cx="2" cy="12" r="3" fill="#fef08a" />
    </g>

    <text x="10" y="152" fill="#e2e8f0" font-size="9.5" font-weight="600">• Tích tụ hạt mỡ &gt;5%</text>
    <text x="10" y="168" fill="#cbd5e1" font-size="9">• Gan phì đại nhẹ</text>
    <text x="10" y="184" fill="#cbd5e1" font-size="9">• Có thể hồi phục 100%</text>
    <rect x="8" y="215" width="114" height="20" rx="4" fill="#713f12" />
    <text x="25" y="229" fill="#fde047" font-size="9.5" font-weight="700">Hồi phục được</text>
  </g>

  <!-- STAGE 2: VIÊM GAN XƠ HÓA (FIBROSIS) -->
  <g transform="translate(304, 110)">
    <rect width="130" height="245" rx="10" fill="url(#cStage2)" stroke="#ea580c" stroke-width="1.2" />
    <rect x="8" y="10" width="70" height="20" rx="4" fill="#ea580c" />
    <text x="14" y="24" fill="#ffffff" font-size="10" font-weight="700">GIAI ĐOẠN 3</text>
    <text x="10" y="48" fill="#fb923c" font-size="11" font-weight="700">Viêm Gan Xơ Hóa</text>

    <!-- Liver with Fibrous Scar Bands -->
    <g transform="translate(65, 95)">
      <path d="M-30,-15 C-15,-25 15,-25 30,-10 C35,15 20,25 0,25 C-20,25 -35,10 -30,-15 Z" fill="#78350f" stroke="#ea580c" stroke-width="2"/>
      <!-- Scar fiber lines -->
      <path d="M-22,-8 C-5,5 15,-2 24,10" stroke="#fef08a" stroke-width="2" fill="none" stroke-dasharray="3 1"/>
      <path d="M-10,-18 L5,18" stroke="#fef08a" stroke-width="1.5" fill="none"/>
    </g>

    <text x="10" y="152" fill="#e2e8f0" font-size="9.5" font-weight="600">• Lắng đọng Collagen</text>
    <text x="10" y="168" fill="#cbd5e1" font-size="9">• Tạo dải xơ bắc cầu F2-F3</text>
    <text x="10" y="184" fill="#cbd5e1" font-size="9">• Men gan tăng mạn tính</text>
    <rect x="8" y="215" width="114" height="20" rx="4" fill="#7c2d12" />
    <text x="24" y="229" fill="#fdba74" font-size="9.5" font-weight="700">Xơ hóa tiến triển</text>
  </g>

  <!-- STAGE 3: XƠ GAN NỐT (CIRRHOSIS F4) -->
  <g transform="translate(446, 110)">
    <rect width="134" height="245" rx="10" fill="url(#cStage3)" stroke="#e11d48" stroke-width="1.2" />
    <rect x="8" y="10" width="70" height="20" rx="4" fill="#e11d48" />
    <text x="14" y="24" fill="#ffffff" font-size="10" font-weight="700">GIAI ĐOẠN 4</text>
    <text x="10" y="48" fill="#fda4af" font-size="11" font-weight="700">Xơ Gan F4 (Mất Bù)</text>

    <!-- Nodular Liver with bumpy surface -->
    <g transform="translate(67, 95)">
      <path d="M-28,-12 C-25,-18 -15,-22 -10,-18 C-5,-24 10,-22 18,-15 C26,-18 32,-8 28,5 C32,15 22,24 10,22 C0,28 -15,24 -22,18 C-32,12 -30,0 -28,-12 Z" 
            fill="#451a03" stroke="#e11d48" stroke-width="2"/>
      <!-- Nodules bump dots -->
      <circle cx="-12" cy="-5" r="4" fill="#78350f" stroke="#fca5a5" stroke-width="1"/>
      <circle cx="8" cy="2" r="5" fill="#78350f" stroke="#fca5a5" stroke-width="1"/>
      <circle cx="-2" cy="12" r="3.5" fill="#78350f" stroke="#fca5a5" stroke-width="1"/>
    </g>

    <text x="10" y="152" fill="#e2e8f0" font-size="9.5" font-weight="600">• Bề mặt sần sùi cục nốt</text>
    <text x="10" y="168" fill="#cbd5e1" font-size="9">• Tăng áp lực tĩnh mạch cửa</text>
    <text x="10" y="184" fill="#cbd5e1" font-size="9">• Báng bụng &amp; xuất huyết tiêu hóa</text>
    <rect x="8" y="215" width="118" height="20" rx="4" fill="#4c0519" />
    <text x="24" y="229" fill="#fda4af" font-size="9.5" font-weight="700">Không thể đảo ngược</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="atheroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09121d" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>

    <!-- Stage Gradients -->
    <linearGradient id="stage0" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="stage1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#854d0e" />
      <stop offset="100%" stop-color="#422006" />
    </linearGradient>
    <linearGradient id="stage2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9a3412" />
      <stop offset="100%" stop-color="#431407" />
    </linearGradient>
    <linearGradient id="stage3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#881337" />
      <stop offset="100%" stop-color="#4c0519" />
    </linearGradient>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#atheroBg)" stroke="#27272a" stroke-width="1.5" />

  <!-- Badge Header -->
  <g transform="translate(24, 24)">
    <rect width="250" height="26" rx="6" fill="#be123c" fill-opacity="0.3" stroke="#f43f5e" stroke-width="1" />
    <text x="12" y="17" fill="#fb7185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11.5" font-weight="700" letter-spacing="0.5">TIẾN TRIỂN BỆNH HỌC MẠCH VÀNH</text>
  </g>
  <text x="24" y="70" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="16" font-weight="700">4 Giai Đoạn Xơ Vữa Động Mạch &amp; Nhồi Máu Cơ Tim</text>
  <text x="24" y="88" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11.5">Sự tích tụ mảng xơ mỡ (Plaque), hẹp lòng mạch đến nứt vỡ hình thành cục máu đông</text>

  <!-- 4 Columns -->
  <!-- STAGE 0: BÌNH THƯỜNG -->
  <g transform="translate(20, 110)">
    <rect width="130" height="245" rx="10" fill="url(#stage0)" stroke="#059669" stroke-width="1.2" />
    <rect x="8" y="10" width="70" height="20" rx="4" fill="#059669" />
    <text x="14" y="24" fill="#ffffff" font-size="10" font-weight="700">GIAI ĐOẠN 1</text>
    <text x="10" y="48" fill="#34d399" font-size="11" font-weight="700">Mạch Khỏe Mạnh</text>

    <!-- Vessel Cross-section -->
    <g transform="translate(65, 95)">
      <circle cx="0" cy="0" r="32" fill="#7f1d1d" stroke="#ef4444" stroke-width="3"/>
      <circle cx="0" cy="0" r="24" fill="#991b1b" />
      <circle cx="0" cy="0" r="18" fill="#dc2626" />
    </g>

    <text x="10" y="152" fill="#e2e8f0" font-size="9.5" font-weight="600">• Lòng mạch thông suốt</text>
    <text x="10" y="168" fill="#cbd5e1" font-size="9">• Nội mạc nhẵn bóng</text>
    <text x="10" y="184" fill="#cbd5e1" font-size="9">• Thành mạch đàn hồi tốt</text>
    <rect x="8" y="215" width="114" height="20" rx="4" fill="#065f46" />
    <text x="32" y="229" fill="#a7f3d0" font-size="9.5" font-weight="700">Bình thường</text>
  </g>

  <!-- STAGE 1: VỆT MỠ & MẢNG XƠ SỚM -->
  <g transform="translate(162, 110)">
    <rect width="130" height="245" rx="10" fill="url(#stage1)" stroke="#ca8a04" stroke-width="1.2" />
    <rect x="8" y="10" width="70" height="20" rx="4" fill="#ca8a04" />
    <text x="14" y="24" fill="#ffffff" font-size="10" font-weight="700">GIAI ĐOẠN 2</text>
    <text x="10" y="48" fill="#facc15" font-size="11" font-weight="700">Vệt Mỡ Nội Mạc</text>

    <!-- Vessel Cross-section -->
    <g transform="translate(65, 95)">
      <circle cx="0" cy="0" r="32" fill="#7f1d1d" stroke="#ef4444" stroke-width="3"/>
      <!-- Lipid streak cushion -->
      <path d="M-18,-15 C-5,-25 15,-20 20,-10 C15,0 -5,-5 -18,-15 Z" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
      <circle cx="0" cy="5" r="16" fill="#dc2626" />
    </g>

    <text x="10" y="152" fill="#e2e8f0" font-size="9.5" font-weight="600">• Lắng đọng LDL-C</text>
    <text x="10" y="168" fill="#cbd5e1" font-size="9">• Đại thực bào ăn mỡ</text>
    <text x="10" y="184" fill="#cbd5e1" font-size="9">• Chưa gây triệu chứng</text>
    <rect x="8" y="215" width="114" height="20" rx="4" fill="#713f12" />
    <text x="32" y="229" fill="#fde047" font-size="9.5" font-weight="700">Hẹp nhẹ &lt;30%</text>
  </g>

  <!-- STAGE 2: MẢNG XƠ SỢI & ĐAU THẮT NGỰC -->
  <g transform="translate(304, 110)">
    <rect width="130" height="245" rx="10" fill="url(#stage2)" stroke="#ea580c" stroke-width="1.2" />
    <rect x="8" y="10" width="70" height="20" rx="4" fill="#ea580c" />
    <text x="14" y="24" fill="#ffffff" font-size="10" font-weight="700">GIAI ĐOẠN 3</text>
    <text x="10" y="48" fill="#fb923c" font-size="11" font-weight="700">Mảng Xơ Vữa Sợi</text>

    <!-- Vessel Cross-section -->
    <g transform="translate(65, 95)">
      <circle cx="0" cy="0" r="32" fill="#7f1d1d" stroke="#ef4444" stroke-width="3"/>
      <!-- Large Plaque occupying 70% -->
      <path d="M-24,-20 C-5,-32 25,-15 24,10 C10,20 -15,10 -24,-20 Z" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
      <ellipse cx="-5" cy="15" rx="9" ry="8" fill="#dc2626" />
    </g>

    <text x="10" y="152" fill="#e2e8f0" font-size="9.5" font-weight="600">• Mũ sợi collagen dày</text>
    <text x="10" y="168" fill="#cbd5e1" font-size="9">• Hẹp 70% lòng mạch</text>
    <text x="10" y="184" fill="#cbd5e1" font-size="9">• Đau thắt ngực khi gắng sức</text>
    <rect x="8" y="215" width="114" height="20" rx="4" fill="#7c2d12" />
    <text x="25" y="229" fill="#fdba74" font-size="9.5" font-weight="700">Hẹp 70% - Cảnh báo</text>
  </g>

  <!-- STAGE 3: NỨT VỠ MẢNG XƠ & HUYẾT KHỐI CẤP -->
  <g transform="translate(446, 110)">
    <rect width="134" height="245" rx="10" fill="url(#stage3)" stroke="#e11d48" stroke-width="1.2" />
    <rect x="8" y="10" width="70" height="20" rx="4" fill="#e11d48" />
    <text x="14" y="24" fill="#ffffff" font-size="10" font-weight="700">GIAI ĐOẠN 4</text>
    <text x="10" y="48" fill="#fda4af" font-size="11" font-weight="700">Nhồi Máu Cơ Tim</text>

    <!-- Vessel Cross-section -->
    <g transform="translate(67, 95)">
      <circle cx="0" cy="0" r="32" fill="#7f1d1d" stroke="#ef4444" stroke-width="3"/>
      <!-- Ruptured Plaque -->
      <path d="M-24,-20 C-5,-32 25,-15 24,10 C10,20 -15,10 -24,-20 Z" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
      <!-- Red Thrombus Clot totally occluding lumen -->
      <circle cx="-5" cy="15" r="9" fill="#4c0519" stroke="#be123c" stroke-width="2"/>
      <path d="M-10,12 L0,18 M-3,9 L-7,21" stroke="#f43f5e" stroke-width="1.5"/>
    </g>

    <text x="10" y="152" fill="#e2e8f0" font-size="9.5" font-weight="600">• Nứt vỡ mảng xơ vữa</text>
    <text x="10" y="168" fill="#cbd5e1" font-size="9">• Cục máu đông bít 100%</text>
    <text x="10" y="184" fill="#cbd5e1" font-size="9">• Hoại tử cơ tim cấp tính</text>
    <rect x="8" y="215" width="118" height="20" rx="4" fill="#4c0519" />
    <text x="24" y="229" fill="#fda4af" font-size="9.5" font-weight="700">Tắc cấp - Cấp cứu</text>
  </g>
</svg>

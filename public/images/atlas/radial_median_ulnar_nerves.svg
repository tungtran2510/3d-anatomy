<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradHand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071326"/>
      <stop offset="100%" stop-color="#0b2247"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="480" height="300" fill="url(#bgGradHand)" rx="10"/>

  <!-- Title Badge -->
  <rect x="20" y="16" width="250" height="26" rx="6" fill="#0f2b5c" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="32" y="33" fill="#f8fafc" font-size="12" font-weight="700" font-family="Inter, sans-serif">PHÂN BỐ 3 DÂY THẦN KINH BÀN TAY</text>

  <rect x="280" y="16" width="180" height="26" rx="6" fill="rgba(30, 64, 175, 0.4)" stroke="#60a5fa" stroke-width="1"/>
  <text x="290" y="33" fill="#93c5fd" font-size="11" font-weight="600" font-family="Inter, sans-serif">Cảm giác Gan tay &amp; Mu tay</text>

  <!-- Legend Bar (Bảng chú giải 3 màu chuẩn Y khoa) -->
  <g transform="translate(30, 52)">
    <rect x="0" y="0" width="12" height="12" rx="3" fill="#facc15"/>
    <text x="18" y="10" fill="#fde047" font-size="9" font-weight="700">DÂY GIỮA (Median)</text>

    <rect x="150" y="0" width="12" height="12" rx="3" fill="#10b981"/>
    <text x="168" y="10" fill="#6ee7b7" font-size="9" font-weight="700">DÂY TRỤ (Ulnar)</text>

    <rect x="280" y="0" width="12" height="12" rx="3" fill="#c084fc"/>
    <text x="298" y="10" fill="#e9d5ff" font-size="9" font-weight="700">DÂY QUAY (Radial)</text>
  </g>

  <!-- LEFT: PALMAR VIEW (Mặt gan bàn tay) -->
  <g transform="translate(100, 170)">
    <text x="0" y="-88" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">MẶT GAN TAY (Palmar)</text>
    
    <!-- Base Palm Outline -->
    <path d="M -45 50 L -45 10 C -55 -10, -65 -20, -65 -45 C -65 -60, -55 -65, -45 -55 C -40 -40, -35 -20, -30 0 L -30 -60 C -30 -75, -15 -75, -15 -60 L -15 -10 L -10 -70 C -10 -85, 8 -85, 8 -70 L 8 -10 L 15 -65 C 15 -80, 30 -80, 30 -65 L 30 0 L 35 -40 C 35 -55, 48 -55, 48 -40 L 48 20 C 48 50, 35 65, 25 70 L -35 70 Z" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>

    <!-- Median Nerve Sensory Zone (Ngón 1, 2, 3 và nửa ngón 4) -->
    <path d="M -65 -45 C -65 -60, -55 -65, -45 -55 C -40 -40, -35 -20, -30 0 L -30 -60 C -30 -75, -15 -75, -15 -60 L -15 -10 L -10 -70 C -10 -85, 8 -85, 8 -70 L 8 -10 L 15 -65 C 15 -75, 22 -75, 22 -50 L 22 20 C 22 45, 0 65, -35 65 L -45 50 L -45 10 C -55 -10, -65 -20, -65 -45 Z" fill="#facc15" opacity="0.6"/>

    <!-- Ulnar Nerve Sensory Zone (Ngón 5 và nửa ngón 4) -->
    <path d="M 22 -50 C 22 -75, 30 -80, 30 -65 L 30 0 L 35 -40 C 35 -55, 48 -55, 48 -40 L 48 20 C 48 50, 35 65, 22 65 L 22 20 Z" fill="#10b981" opacity="0.75"/>

    <!-- Labels -->
    <text x="-48" y="-72" fill="#facc15" font-size="8.5" font-weight="700">Ngón I-II-III</text>
    <text x="40" y="-62" fill="#10b981" font-size="8.5" font-weight="700">Ngón V</text>
    <text x="0" y="85" fill="#94a3b8" font-size="8.5" text-anchor="middle">Ống cổ tay (TK Giữa)</text>
  </g>

  <!-- RIGHT: DORSAL VIEW (Mặt mu bàn tay) -->
  <g transform="translate(320, 170)">
    <text x="0" y="-88" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">MẶT MU TAY (Dorsal)</text>
    
    <!-- Base Palm Outline (Mirrored) -->
    <path d="M -48 20 C -48 50, -35 65, -25 70 L 35 70 L 45 50 L 45 10 C 55 -10, 65 -20, 65 -45 C 65 -60, 55 -65, 45 -55 C 40 -40, 35 -20, 30 0 L 30 -60 C 30 -75, 15 -75, 15 -60 L 15 -10 L 10 -70 C 10 -85, -8 -85, -8 -70 L -8 -10 L -15 -65 C -15 -80, -30 -80, -30 -65 L -30 0 L -35 -40 C -35 -55, -48 -55, -48 -40 Z" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>

    <!-- Radial Nerve Sensory Zone (Nửa ngoài mu tay & gốc ngón I, II, III) -->
    <path d="M 65 -45 C 65 -60, 55 -65, 45 -55 C 40 -40, 35 -20, 30 0 L 30 -30 L 15 -30 L 15 -10 L 10 -30 L -8 -30 L -8 -10 L -10 20 L -10 65 L 35 65 L 45 50 L 45 10 C 55 -10, 65 -20, 65 -45 Z" fill="#c084fc" opacity="0.7"/>

    <!-- Median Nerve Finger Tips (Đầu múp ngón I, II, III mu tay) -->
    <path d="M 30 -30 L 30 -60 C 30 -75, 15 -75, 15 -60 L 15 -30 Z" fill="#facc15" opacity="0.6"/>
    <path d="M 10 -30 L 10 -70 C 10 -85, -8 -85, -8 -70 L -8 -30 Z" fill="#facc15" opacity="0.6"/>

    <!-- Ulnar Nerve Dorsal Zone (Nửa trong mu bàn tay & ngón V) -->
    <path d="M -10 20 L -15 -65 C -15 -80, -30 -80, -30 -65 L -30 0 L -35 -40 C -35 -55, -48 -55, -48 -40 L -48 20 C -48 50, -35 65, -10 65 Z" fill="#10b981" opacity="0.75"/>

    <!-- Labels -->
    <text x="35" y="85" fill="#c084fc" font-size="8.5" font-weight="700">Hõm lào (TK Quay)</text>
    <text x="-40" y="-62" fill="#10b981" font-size="8.5" font-weight="700">TK Trụ</text>
  </g>
</svg>

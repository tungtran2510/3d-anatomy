<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="injBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#injBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Title Badge -->
  <g transform="translate(24, 24)">
    <rect width="230" height="26" rx="6" fill="#b91c1c" fill-opacity="0.3" stroke="#ef4444" stroke-width="1" />
    <text x="12" y="17" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11.5" font-weight="700" letter-spacing="0.5">CHẤN THƯƠNG THỂ THAO &amp; THOÁI HÓA</text>
  </g>
  <text x="24" y="70" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="16" font-weight="700">4 Cấp Độ Tổn Thương Dây Chằng Chéo ACL &amp; Rách Sụn Chêm</text>
  <text x="24" y="88" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11.5">Từ giãn vi thể bó sợi đến đứt hoàn toàn dây chằng và rách quai vali kẹt khớp</text>

  <!-- 4 Comparison Columns -->
  <!-- Col 1: Bình thường -->
  <g transform="translate(24, 115)">
    <rect width="130" height="195" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <rect x="0" y="0" width="130" height="28" rx="8" fill="#065f46" />
    <text x="65" y="18" text-anchor="middle" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="700">CẤP 0: BÌNH THƯỜNG</text>
    
    <!-- Mini Graphic -->
    <path d="M40,55 L85,115" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <path d="M25,120 C45,115 85,115 105,120" stroke="#2dd4bf" stroke-width="6" stroke-linecap="round"/>
    
    <text x="10" y="148" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="700">• Dây chằng liên tục</text>
    <text x="10" y="164" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9.5">• Sụn chêm nhẵn bóng</text>
    <text x="10" y="180" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9.5">• Gối vững 100% trục</text>
  </g>

  <!-- Col 2: Giãn Độ 1 -->
  <g transform="translate(164, 115)">
    <rect width="130" height="195" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <rect x="0" y="0" width="130" height="28" rx="8" fill="#92400e" />
    <text x="65" y="18" text-anchor="middle" fill="#fde68a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="700">CẤP 1: GIÃN ĐỘ 1</text>
    
    <!-- Mini Graphic -->
    <path d="M40,55 L85,115" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
    <line x1="60" y1="80" x2="65" y2="90" stroke="#b45309" stroke-width="2"/>
    <path d="M25,120 C45,115 85,115 105,120" stroke="#2dd4bf" stroke-width="6" stroke-linecap="round"/>

    <text x="10" y="148" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="700">• Rách vi thể &lt;5% sợi</text>
    <text x="10" y="164" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9.5">• Đau phù nề nhẹ</text>
    <text x="10" y="180" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9.5">• Chưa mất vững gối</text>
  </g>

  <!-- Col 3: Rách Bán Phần Độ 2 -->
  <g transform="translate(304, 115)">
    <rect width="130" height="195" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="1.5" />
    <rect x="0" y="0" width="130" height="28" rx="8" fill="#9a3412" />
    <text x="65" y="18" text-anchor="middle" fill="#fed7aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="700">CẤP 2: RÁCH BÁN PHẦN</text>
    
    <!-- Mini Graphic -->
    <path d="M40,55 L58,78" stroke="#f97316" stroke-width="8" stroke-linecap="round"/>
    <path d="M68,92 L85,115" stroke="#f97316" stroke-width="5" stroke-linecap="round"/>
    <path d="M25,120 C45,115 85,115 105,120" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>

    <text x="10" y="148" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="700">• Đứt 50% bó sợi</text>
    <text x="10" y="164" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9.5">• Lỏng lẻo khi xoay gối</text>
    <text x="10" y="180" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9.5">• Tràn dịch khớp gối</text>
  </g>

  <!-- Col 4: Đứt Hoàn Toàn Độ 3 -->
  <g transform="translate(444, 115)">
    <rect width="130" height="195" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" />
    <rect x="0" y="0" width="130" height="28" rx="8" fill="#991b1b" />
    <text x="65" y="18" text-anchor="middle" fill="#fecaca" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="700">CẤP 3: ĐỨT HOÀN TOÀN</text>
    
    <!-- Mini Graphic -->
    <path d="M40,55 L52,70" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/>
    <path d="M72,100 L85,115" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/>
    <line x1="50" y1="75" x2="75" y2="95" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="2 2"/>
    <!-- Torn Meniscus Bucket Handle -->
    <path d="M25,120 C35,110 50,110 65,118" stroke="#ef4444" stroke-width="6"/>

    <text x="10" y="148" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="700">• Đứt lìa hoàn toàn ACL</text>
    <text x="10" y="164" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9.5">• Rách sụn quai vali</text>
    <text x="10" y="180" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9.5">• Kẹt khớp, cần mổ nội soi</text>
  </g>

  <!-- Bottom Insight Bar -->
  <g transform="translate(24, 328)">
    <rect width="552" height="34" rx="7" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="16" y="21" fill="#ef4444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11.5" font-weight="700">DẤU HIỆU LÂM SÀNG:</text>
    <text x="156" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11">Tiếng "bốp" (pop) khi chấn thương xoay gối + Dấu hiệu Ngăn kéo trước (+) và Lachman (+).</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071326"/>
      <stop offset="100%" stop-color="#0b2247"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="480" height="300" fill="url(#bgGrad3)" rx="10"/>

  <!-- Title Badge -->
  <rect x="20" y="16" width="260" height="26" rx="6" fill="#0f2b5c" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="32" y="33" fill="#f8fafc" font-size="12" font-weight="700" font-family="Inter, sans-serif">4 CẤP ĐỘ: SỎI THẬN &amp; SUY THẬN (CKD)</text>

  <rect x="290" y="16" width="170" height="26" rx="6" fill="rgba(30, 64, 175, 0.4)" stroke="#60a5fa" stroke-width="1"/>
  <text x="300" y="33" fill="#93c5fd" font-size="11" font-weight="600" font-family="Inter, sans-serif">Tiến triển eGFR &amp; Creatinin</text>

  <!-- 4 Stage Cards Layout -->
  <!-- STAGE 0: Bình thường -->
  <g transform="translate(18, 58)">
    <rect width="105" height="225" rx="8" fill="#0b192e" stroke="#10b981" stroke-width="1.5"/>
    <rect x="6" y="8" width="93" height="20" rx="4" fill="rgba(16, 185, 129, 0.15)"/>
    <text x="52" y="22" fill="#34d399" font-size="9.5" font-weight="700" text-anchor="middle">CẤP 0: BÌNH THƯỜNG</text>

    <!-- Normal Kidney Vector -->
    <path d="M 40 45 C 65 45, 75 60, 72 85 C 68 105, 55 120, 38 122 C 20 124, 10 105, 14 80 C 16 55, 25 45, 40 45 Z" fill="#b91c1c" stroke="#f87171" stroke-width="1"/>
    <!-- Clear Pelvis -->
    <path d="M 50 80 L 55 95 L 48 97 Z" fill="#fbbf24"/>

    <text x="52" y="142" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">eGFR > 90</text>
    <text x="52" y="156" fill="#94a3b8" font-size="8" text-anchor="middle">ml/phút/1.73m²</text>

    <line x1="12" y1="166" x2="93" y2="166" stroke="#1e293b"/>
    <text x="10" y="180" fill="#cbd5e1" font-size="8">• Thận hồng hào</text>
    <text x="10" y="194" fill="#cbd5e1" font-size="8">• Bể thận thông thoáng</text>
    <text x="10" y="208" fill="#cbd5e1" font-size="8">• Nước tiểu trong</text>
    <text x="10" y="222" fill="#cbd5e1" font-size="8">• Creatinin 60–110 µmol</text>
  </g>

  <!-- STAGE 1: Sỏi thận & Ứ nước nhẹ -->
  <g transform="translate(131, 58)">
    <rect width="105" height="225" rx="8" fill="#0b192e" stroke="#38bdf8" stroke-width="1.2"/>
    <rect x="6" y="8" width="93" height="20" rx="4" fill="rgba(56, 189, 248, 0.15)"/>
    <text x="52" y="22" fill="#38bdf8" font-size="9.5" font-weight="700" text-anchor="middle">CẤP 1: SỎI ĐÀI BỂ THẬN</text>

    <!-- Kidney with Stone in Calyx -->
    <path d="M 40 45 C 65 45, 75 60, 72 85 C 68 105, 55 120, 38 122 C 20 124, 10 105, 14 80 C 16 55, 25 45, 40 45 Z" fill="#b91c1c" stroke="#f87171" stroke-width="1"/>
    <!-- Stones (Calcium Oxalate) -->
    <circle cx="45" cy="75" r="4.5" fill="#facc15" stroke="#ffffff" stroke-width="0.8"/>
    <circle cx="52" cy="85" r="3.5" fill="#facc15" stroke="#ffffff" stroke-width="0.8"/>

    <text x="52" y="142" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">eGFR 60–89</text>
    <text x="52" y="156" fill="#94a3b8" font-size="8" text-anchor="middle">Tổn thương sớm</text>

    <line x1="12" y1="166" x2="93" y2="166" stroke="#1e293b"/>
    <text x="10" y="180" fill="#cbd5e1" font-size="8">• Sỏi đài thận 4–8mm</text>
    <text x="10" y="194" fill="#cbd5e1" font-size="8">• Đau mỏi vùng thắt lưng</text>
    <text x="10" y="208" fill="#cbd5e1" font-size="8">• Đái buốt, tiểu rắt</text>
    <text x="10" y="222" fill="#cbd5e1" font-size="8">• Hồng cầu niệu vi thể</text>
  </g>

  <!-- STAGE 2: Kẹt niệu quản & Thận ứ nước độ 2-3 -->
  <g transform="translate(244, 58)">
    <rect width="105" height="225" rx="8" fill="#0b192e" stroke="#f59e0b" stroke-width="1.2"/>
    <rect x="6" y="8" width="93" height="20" rx="4" fill="rgba(245, 158, 11, 0.15)"/>
    <text x="52" y="22" fill="#fbbf24" font-size="9.5" font-weight="700" text-anchor="middle">CẤP 2: KẸT NIỆU QUẢN</text>

    <!-- Hydronephrotic Swollen Kidney -->
    <path d="M 40 40 C 75 40, 85 60, 80 88 C 75 112, 60 125, 38 127 C 15 129, 5 110, 8 78 C 10 50, 20 40, 40 40 Z" fill="#991b1b" stroke="#fbbf24" stroke-width="1.5"/>
    <!-- Dilated Pelvis (Bể thận dãn phình) -->
    <path d="M 48 70 C 62 75, 65 92, 58 100 L 62 118 Z" fill="#0284c7" opacity="0.8"/>
    <!-- Impacted Stone blocking ureter -->
    <polygon points="58,114 66,118 60,122 54,118" fill="#facc15" stroke="#ffffff" stroke-width="1"/>

    <text x="52" y="142" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle">eGFR 30–59</text>
    <text x="52" y="156" fill="#fbbf24" font-size="8" text-anchor="middle">Cơn đau quặn thận</text>

    <line x1="12" y1="166" x2="93" y2="166" stroke="#1e293b"/>
    <text x="10" y="180" fill="#cbd5e1" font-size="8">• Sỏi kẹt niệu quản</text>
    <text x="10" y="194" fill="#cbd5e1" font-size="8">• Ứ nước dãn đài thận</text>
    <text x="10" y="208" fill="#cbd5e1" font-size="8">• Cơn đau dữ dội lan bẹn</text>
    <text x="10" y="222" fill="#cbd5e1" font-size="8">• Nhu mô thận mỏng dần</text>
  </g>

  <!-- STAGE 3: Suy thận mạn giai đoạn cuối (ESRD) -->
  <g transform="translate(357, 58)">
    <rect width="105" height="225" rx="8" fill="#0b192e" stroke="#ef4444" stroke-width="1.8"/>
    <rect x="6" y="8" width="93" height="20" rx="4" fill="rgba(239, 68, 68, 0.2)"/>
    <text x="52" y="22" fill="#f87171" font-size="9" font-weight="700" text-anchor="middle">CẤP 3: SUY THẬN GĐ CUỐI</text>

    <!-- Shrunken, Atrophic, Fibrotic Kidney (Thận teo xơ chai) -->
    <path d="M 40 55 C 55 58, 60 70, 58 85 C 55 98, 48 108, 38 108 C 25 108, 18 95, 20 80 C 22 68, 30 55, 40 55 Z" fill="#450a0a" stroke="#ef4444" stroke-width="1.8" stroke-dasharray="3,2"/>
    <!-- Scarring notches -->
    <path d="M 28 65 L 34 72 M 52 75 L 45 82 M 30 92 L 38 96" stroke="#fca5a5" stroke-width="1.5"/>

    <text x="52" y="142" fill="#ef4444" font-size="10" font-weight="700" text-anchor="middle">eGFR &lt; 15</text>
    <text x="52" y="156" fill="#f87171" font-size="8" font-weight="700" text-anchor="middle">Chạy thận nhân tạo</text>

    <line x1="12" y1="166" x2="93" y2="166" stroke="#1e293b"/>
    <text x="10" y="180" fill="#fca5a5" font-size="8">• Thận teo nhỏ xơ hóa</text>
    <text x="10" y="194" fill="#fca5a5" font-size="8">• Hội chứng Ure máu cao</text>
    <text x="10" y="208" fill="#fca5a5" font-size="8">• Thiếu máu, tăng Kali</text>
    <text x="10" y="222" fill="#fca5a5" font-size="8">• Chỉ định lọc máu/Ghép</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071326"/>
      <stop offset="50%" stop-color="#0b2559"/>
      <stop offset="100%" stop-color="#0f2b5c"/>
    </linearGradient>
    <linearGradient id="lumenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="mucosaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="submucosaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="muscleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" fill="url(#bgNavy)" rx="12"/>
  <rect width="596" height="356" x="2" y="2" fill="none" stroke="#1e40af" stroke-width="1.5" stroke-opacity="0.4" rx="10"/>

  <!-- Title Badge -->
  <g transform="translate(24, 20)">
    <rect width="320" height="28" rx="6" fill="#0b2559" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="16" cy="14" r="5" fill="#38bdf8"/>
    <text x="30" y="19" fill="#e8f0fe" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">MÔ HỌC VI THỂ 4 LỚP THÀNH DẠ DÀY</text>
  </g>

  <!-- Diagram Container -->
  <g transform="translate(30, 60)">
    <!-- 0. LÒNG DẠ DÀY & DỊCH VỊ (Gastric Lumen & Mucus Gel Layer) -->
    <rect x="0" y="0" width="340" height="35" fill="url(#lumenGrad)" opacity="0.3" rx="4"/>
    <path d="M 0 35 Q 25 31, 50 35 T 100 35 T 150 35 T 200 35 T 250 35 T 300 35 T 340 35" stroke="#f59e0b" stroke-width="2" fill="none"/>
    <text x="12" y="22" fill="#fef3c7" font-size="11" font-weight="bold">Lòng dạ dày (Chứa Axit HCl pH 1.5 – 2.0 &amp; Men Pepsin)</text>

    <!-- 1. LỚP NIÊM MẠC (Mucosa) -->
    <rect x="0" y="38" width="340" height="70" fill="url(#mucosaGrad)" opacity="0.85" rx="4"/>
    <!-- Gastric pits representation (Hố tuyến dạ dày) -->
    <path d="
      M 15 38 L 15 75 A 4 4 0 0 0 25 75 L 25 38
      M 50 38 L 50 78 A 4 4 0 0 0 60 78 L 60 38
      M 85 38 L 85 75 A 4 4 0 0 0 95 75 L 95 38
      M 120 38 L 120 78 A 4 4 0 0 0 130 78 L 130 38
      M 155 38 L 155 75 A 4 4 0 0 0 165 75 L 165 38
      M 190 38 L 190 78 A 4 4 0 0 0 200 78 L 200 38
      M 225 38 L 225 75 A 4 4 0 0 0 235 75 L 235 38
      M 260 38 L 260 78 A 4 4 0 0 0 270 78 L 270 38
      M 295 38 L 295 75 A 4 4 0 0 0 305 75 L 305 38
    " stroke="#ffe4e6" stroke-width="1.8" fill="none"/>
    <!-- Muscularis mucosae (Cơ niêm mỏng) -->
    <line x1="0" y1="108" x2="340" y2="108" stroke="#be123c" stroke-width="2.5" stroke-dasharray="4,2"/>

    <!-- 2. LỚP DƯỚI NIÊM MẠC (Submucosa) -->
    <rect x="0" y="112" width="340" height="42" fill="url(#submucosaGrad)" opacity="0.9" rx="4"/>
    <!-- Blood vessels & Meissner plexus in submucosa -->
    <path d="M 30 133 Q 60 125, 90 133 T 150 133 T 210 133 T 270 133 T 320 133" stroke="#ef4444" stroke-width="2" fill="none"/>
    <path d="M 30 137 Q 60 145, 90 137 T 150 137 T 210 137 T 270 137 T 320 137" stroke="#3b82f6" stroke-width="2" fill="none"/>
    <!-- Meissner nerve nodes -->
    <circle cx="75" cy="123" r="3" fill="#fbbf24"/>
    <circle cx="185" cy="123" r="3" fill="#fbbf24"/>
    <circle cx="280" cy="123" r="3" fill="#fbbf24"/>

    <!-- 3. LỚP CƠ (Muscularis Externa: 3 Lớp đan chéo) -->
    <rect x="0" y="158" width="340" height="68" fill="url(#muscleGrad)" opacity="0.9" rx="4"/>
    <!-- 3a: Inner oblique (Cơ chéo trong) -->
    <path d="M 10 162 L 35 180 M 50 162 L 75 180 M 90 162 L 115 180 M 130 162 L 155 180 M 170 162 L 195 180 M 210 162 L 235 180 M 250 162 L 275 180 M 290 162 L 315 180" stroke="#fda4af" stroke-width="1.2" opacity="0.6"/>
    <!-- 3b: Middle circular (Cơ vòng giữa) -->
    <line x1="0" y1="192" x2="340" y2="192" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3,2"/>
    <!-- Auerbach plexus -->
    <circle cx="120" cy="192" r="3.5" fill="#facc15" stroke="#713f12" stroke-width="0.8"/>
    <circle cx="230" cy="192" r="3.5" fill="#facc15" stroke="#713f12" stroke-width="0.8"/>
    <!-- 3c: Outer longitudinal (Cơ dọc ngoài) -->
    <path d="M 20 198 V 224 M 60 198 V 224 M 100 198 V 224 M 140 198 V 224 M 180 198 V 224 M 220 198 V 224 M 260 198 V 224 M 300 198 V 224" stroke="#fda4af" stroke-width="1.2" opacity="0.5"/>

    <!-- 4. LỚP THANH MẠC (Serosa) -->
    <rect x="0" y="230" width="340" height="15" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="3"/>
    <text x="12" y="241" fill="#38bdf8" font-size="10" font-weight="bold">Lớp thanh mạc (Phúc mạc tạng - Giảm ma sát ổ bụng)</text>
  </g>

  <!-- Labels & Callouts on the Right Side -->
  <g transform="translate(390, 60)">
    <!-- Mucosa Callout -->
    <rect width="185" height="48" rx="6" fill="#0b2559" stroke="#fda4af" stroke-width="1"/>
    <text x="10" y="18" fill="#fda4af" font-size="11" font-weight="bold">1. LỚP NIÊM MẠC (Mucosa)</text>
    <text x="10" y="32" fill="#e8f0fe" font-size="9.5">• Tế bào viền: Tiết HCl (pH 1.5)</text>
    <text x="10" y="43" fill="#e8f0fe" font-size="9.5">• Tế bào chính: Tiết Pepsinogen</text>

    <!-- Submucosa Callout -->
    <rect y="56" width="185" height="42" rx="6" fill="#0b2559" stroke="#c7d2fe" stroke-width="1"/>
    <text x="10" y="73" fill="#a5b4fc" font-size="11" font-weight="bold">2. LỚP DƯỚI NIÊM (Submucosa)</text>
    <text x="10" y="87" fill="#e8f0fe" font-size="9.5">• Đám rối vi mạch máu nuôi dưỡng</text>
    <text x="10" y="98" fill="#e8f0fe" font-size="9.5">• Đám rối thần kinh Meissner</text>

    <!-- Muscularis Callout -->
    <rect y="106" width="185" height="54" rx="6" fill="#0b2559" stroke="#f43f5e" stroke-width="1"/>
    <text x="10" y="123" fill="#f43f5e" font-size="11" font-weight="bold">3. LỚP CƠ (3 Lớp đặc thù)</text>
    <text x="10" y="137" fill="#e8f0fe" font-size="9.5">• Cơ chéo trong - Cơ vòng giữa</text>
    <text x="10" y="148" fill="#e8f0fe" font-size="9.5">• Cơ dọc ngoài (Co bóp 3D)</text>
    <text x="10" y="159" fill="#fde047" font-size="9.5">• Đám rối TK Auerbach nhào trộn</text>

    <!-- Serosa Callout -->
    <rect y="168" width="185" height="34" rx="6" fill="#0b2559" stroke="#38bdf8" stroke-width="1"/>
    <text x="10" y="185" fill="#38bdf8" font-size="11" font-weight="bold">4. LỚP THANH MẠC (Serosa)</text>
    <text x="10" y="198" fill="#e8f0fe" font-size="9.5">• Phúc mạc trơn láng, chống dính</text>
  </g>

  <!-- Bottom Medical Note -->
  <g transform="translate(24, 322)">
    <rect width="552" height="26" rx="5" fill="#0b2559" stroke="#1e40af" stroke-width="1"/>
    <text x="12" y="17" fill="#93c5fd" font-size="11">🔬 Hàng rào chất nhầy (Mucus-Bicarbonate Barrier) bảo vệ niêm mạc khỏi bị tự tiêu hóa bởi Axit HCl và Pepsin</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="eyeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081426" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Cornea Clear Blue -->
    <linearGradient id="corneaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.4" />
    </linearGradient>

    <!-- Sclera White/Slate -->
    <linearGradient id="scleraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Lens Amber Crystal -->
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6" />
    </linearGradient>

    <!-- Retina Warm Amber -->
    <linearGradient id="retinaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Choroid Deep Vascular Red -->
    <linearGradient id="choroidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#eyeBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Title Badge -->
  <g transform="translate(24, 24)">
    <rect width="210" height="26" rx="6" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1" />
    <text x="12" y="17" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11.5" font-weight="700" letter-spacing="0.5">GIÁC QUAN &amp; THẦN KINH SỌ II</text>
  </g>
  <text x="24" y="70" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="16" font-weight="700">Giải Phẫu Nhãn Cầu &amp; Đường Dẫn Truyền Thị Giác</text>
  <text x="24" y="88" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11.5">Mặt cắt ngang nhãn cầu: Giác mạc, Thể mi, Thể thủy tinh, Võng mạc &amp; Dây TK thị giác</text>

  <!-- Central Eyeball Graphic -->
  <g transform="translate(290, 225)">
    <!-- 1. Optic Nerve exit at posterior -->
    <path d="M-110,12 C-145,15 -180,25 -210,32 L-210,-12 C-180,-5 -145,5 -110,8 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" />
    <path d="M-115,10 C-150,13 -180,22 -210,28" stroke="#ef4444" stroke-width="2.5" />
    <path d="M-115,6 C-150,9 -180,18 -210,24" stroke="#3b82f6" stroke-width="2" />

    <!-- 2. Sclera Outer Shell (Củng mạc) -->
    <circle cx="0" cy="10" r="115" fill="none" stroke="url(#scleraGrad)" stroke-width="14" stroke-dasharray="620" stroke-dashoffset="65" />

    <!-- 3. Choroid Vascular Layer (Hắc mạc) -->
    <circle cx="0" cy="10" r="106" fill="none" stroke="url(#choroidGrad)" stroke-width="4.5" stroke-dasharray="580" stroke-dashoffset="60" />

    <!-- 4. Retina Layer (Võng mạc thị giác) -->
    <circle cx="0" cy="10" r="100" fill="none" stroke="url(#retinaGrad)" stroke-width="3" stroke-dasharray="550" stroke-dashoffset="60" />

    <!-- Vitreous Chamber fill -->
    <circle cx="0" cy="10" r="97" fill="#0369a1" fill-opacity="0.12" />

    <!-- 5. Macula / Fovea centralis (Hoàng điểm) -->
    <circle cx="-98" cy="8" r="5" fill="#facc15" stroke="#ca8a04" stroke-width="1.5" />

    <!-- 6. Cornea Front Dome (Giác mạc trong suốt phía trước) -->
    <path d="M78,-72 C135,-35 135,55 78,92" fill="none" stroke="url(#corneaGrad)" stroke-width="9" stroke-linecap="round" />
    <path d="M78,-72 C135,-35 135,55 78,92" fill="none" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round" />

    <!-- 7. Anterior & Posterior Chamber (Tiền phòng & Hậu phòng) -->
    <path d="M60,-50 C75,-25 75,45 60,70" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>

    <!-- 8. Ciliary Body & Iris (Thể mi & Mống mắt) -->
    <!-- Superior Iris & Ciliary -->
    <path d="M75,-70 C70,-50 62,-40 52,-26" fill="none" stroke="#0284c7" stroke-width="6" stroke-linecap="round" />
    <path d="M75,-70 L65,-58" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" />
    <!-- Inferior Iris & Ciliary -->
    <path d="M75,90 C70,70 62,60 52,46" fill="none" stroke="#0284c7" stroke-width="6" stroke-linecap="round" />
    <path d="M75,90 L65,78" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" />

    <!-- Zonular fibers (Dây chằng Zinn treo thủy tinh thể) -->
    <line x1="58" y1="-32" x2="48" y2="-22" stroke="#e2e8f0" stroke-width="1.2" stroke-dasharray="2 1" />
    <line x1="58" y1="52" x2="48" y2="42" stroke="#e2e8f0" stroke-width="1.2" stroke-dasharray="2 1" />

    <!-- 9. Crystalline Lens (Thể thủy tinh hai mặt lồi) -->
    <ellipse cx="44" cy="10" rx="15" ry="34" fill="url(#lensGrad)" stroke="#38bdf8" stroke-width="2" />

    <!-- Pupil aperture indicator (Đồng tử) -->
    <line x1="52" y1="-26" x2="52" y2="46" stroke="#000000" stroke-width="2" stroke-dasharray="4 4" opacity="0.4"/>

    <!-- Light Path ray through optic axis -->
    <line x1="165" y1="10" x2="-98" y2="10" stroke="#fef08a" stroke-width="1" stroke-dasharray="6 3" opacity="0.75" />
    <polygon points="-98,10 -88,7 -88,13" fill="#fef08a" />
  </g>

  <!-- Callouts Left Side (Posterior Anatomy) -->
  <g transform="translate(30, 140)">
    <text x="0" y="0" fill="#38bdf8" font-size="11" font-weight="700">Dây Thần Kinh Thị Giác (TK II)</text>
    <text x="0" y="14" fill="#94a3b8" font-size="9.5">N. opticus &amp; Bó mạch trung tâm võng mạc</text>
    <path d="M70,22 L110,65 L145,65" fill="none" stroke="#38bdf8" stroke-width="1" />
    <circle cx="145" cy="65" r="2.5" fill="#38bdf8" />
  </g>

  <g transform="translate(30, 240)">
    <text x="0" y="0" fill="#facc15" font-size="11" font-weight="700">Hoàng Điểm &amp; Hố Trung Tâm</text>
    <text x="0" y="14" fill="#94a3b8" font-size="9.5">Macula lutea &amp; Fovea centralis (Điểm nhìn nét)</text>
    <path d="M120,20 L160,20 L185,5" fill="none" stroke="#facc15" stroke-width="1" />
    <circle cx="185" cy="5" r="2.5" fill="#facc15" />
  </g>

  <g transform="translate(30, 320)">
    <text x="0" y="0" fill="#ea580c" font-size="11" font-weight="700">3 Lớp Vỏ Nhãn Cầu</text>
    <text x="0" y="14" fill="#94a3b8" font-size="9.5">Củng mạc (Ngoài) - Hắc mạc (Giữa) - Võng mạc (Trong)</text>
    <path d="M130,22 L180,22 L225,-10" fill="none" stroke="#ea580c" stroke-width="1" />
    <circle cx="225" cy="-10" r="2.5" fill="#ea580c" />
  </g>

  <!-- Callouts Right Side (Anterior Anatomy) -->
  <g transform="translate(420, 140)">
    <text x="0" y="0" fill="#38bdf8" font-size="11" font-weight="700">Giác Mạc (Cornea)</text>
    <text x="0" y="14" fill="#94a3b8" font-size="9.5">Thấu kính hội tụ ánh sáng chính (43 Diop)</text>
    <path d="M-5,10 L-40,10 L-70,55" fill="none" stroke="#38bdf8" stroke-width="1" />
    <circle cx="-70" cy="55" r="2.5" fill="#38bdf8" />
  </g>

  <g transform="translate(420, 230)">
    <text x="0" y="0" fill="#fef08a" font-size="11" font-weight="700">Thể Thủy Tinh (Lens)</text>
    <text x="0" y="14" fill="#94a3b8" font-size="9.5">Điều tiết tiêu cự nhìn gần &amp; nhìn xa</text>
    <path d="M-5,10 L-50,10 L-85,15" fill="none" stroke="#fef08a" stroke-width="1" />
    <circle cx="-85" cy="15" r="2.5" fill="#fef08a" />
  </g>

  <g transform="translate(420, 310)">
    <text x="0" y="0" fill="#0284c7" font-size="11" font-weight="700">Mống Mắt &amp; Đồng Tử (Iris/Pupil)</text>
    <text x="0" y="14" fill="#94a3b8" font-size="9.5">Điều chỉnh lượng ánh sáng đi vào mắt</text>
    <path d="M-5,10 L-35,10 L-75,-30" fill="none" stroke="#0284c7" stroke-width="1" />
    <circle cx="-75" cy="-30" r="2.5" fill="#0284c7" />
  </g>
</svg>

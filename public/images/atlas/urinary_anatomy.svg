<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071326"/>
      <stop offset="100%" stop-color="#0b2247"/>
    </linearGradient>
    <linearGradient id="kidneyLGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="bladderGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="70%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="480" height="300" fill="url(#bgGrad)" rx="10"/>

  <!-- Title Badge -->
  <rect x="20" y="16" width="220" height="26" rx="6" fill="#0f2b5c" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="32" y="33" fill="#f8fafc" font-size="12" font-weight="700" font-family="Inter, sans-serif">HỆ TIẾT NIỆU &amp; 2 THẬN</text>

  <rect x="250" y="16" width="210" height="26" rx="6" fill="rgba(30, 64, 175, 0.4)" stroke="#60a5fa" stroke-width="1"/>
  <text x="260" y="33" fill="#93c5fd" font-size="11" font-weight="600" font-family="Inter, sans-serif">Lọc 180L máu • 1.5L Nước tiểu/ngày</text>

  <!-- Aorta & Vena Cava (Mạch máu lớn) -->
  <path d="M 230 55 L 230 200" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/>
  <text x="226" y="52" fill="#ef4444" font-size="9" font-weight="700" text-anchor="end">ĐM Chủ</text>

  <path d="M 250 55 L 250 200" stroke="#3b82f6" stroke-width="9" stroke-linecap="round"/>
  <text x="254" y="52" fill="#38bdf8" font-size="9" font-weight="700" text-anchor="start">TM Chủ</text>

  <!-- Left & Right Renal Vessels -->
  <!-- Left Kidney Vessels (Viewer's Right) -->
  <path d="M 230 100 C 260 100, 280 110, 310 110" stroke="#ef4444" stroke-width="4" fill="none"/>
  <path d="M 250 115 C 275 115, 290 120, 312 120" stroke="#38bdf8" stroke-width="5" fill="none"/>

  <!-- Right Kidney Vessels (Viewer's Left) -->
  <path d="M 230 110 C 200 110, 185 115, 168 115" stroke="#ef4444" stroke-width="4" fill="none"/>
  <path d="M 250 122 C 220 122, 195 125, 168 125" stroke="#38bdf8" stroke-width="5" fill="none"/>

  <!-- Right Kidney (Viewer's Left - slightly lower due to liver) -->
  <g transform="translate(110, 85)">
    <path d="M 40 5 C 60 5, 68 25, 65 50 C 62 70, 52 85, 35 88 C 15 90, 5 70, 8 45 C 10 20, 20 5, 40 5 Z" fill="url(#kidneyLGrad)" stroke="#fca5a5" stroke-width="1.5" filter="url(#glow)"/>
    <!-- Renal Pelvis (Bể thận) -->
    <path d="M 50 42 C 55 46, 56 55, 52 60 L 58 75 L 53 77 L 46 62 Z" fill="#fbbf24"/>
    <text x="35" y="102" fill="#fecaca" font-size="10" font-weight="700" text-anchor="middle">Thận phải</text>
  </g>

  <!-- Left Kidney Cross-Section (Viewer's Right - higher) -->
  <g transform="translate(305, 75)">
    <!-- Outer Bean shape -->
    <path d="M 30 5 C 50 5, 60 25, 58 50 C 55 70, 45 85, 28 88 C 10 90, 2 70, 5 45 C 8 20, 15 5, 30 5 Z" fill="url(#kidneyLGrad)" stroke="#fca5a5" stroke-width="1.5" filter="url(#glow)"/>
    <!-- Internal Cutaway (Cortex & Medulla Pyramids) -->
    <path d="M 15 25 C 22 20, 42 20, 45 35 C 48 55, 38 72, 20 72 C 14 62, 12 40, 15 25 Z" fill="#7f1d1d"/>
    <!-- Renal Pyramids (Tháp tủy Malpighi) -->
    <polygon points="35,28 45,35 32,40" fill="#b91c1c"/>
    <polygon points="36,44 46,52 33,56" fill="#b91c1c"/>
    <polygon points="30,60 40,68 25,70" fill="#b91c1c"/>
    <!-- Renal Pelvis & Calyces (Đài bể thận) -->
    <path d="M 28 40 C 20 45, 18 55, 22 62 L 15 80 L 10 78 L 16 60 Z" fill="#fbbf24"/>
    <text x="32" y="102" fill="#fecaca" font-size="10" font-weight="700" text-anchor="middle">Thận trái (Bổ dọc)</text>
  </g>

  <!-- Labels on Kidneys -->
  <line x1="355" y1="105" x2="410" y2="90" stroke="#93c5fd" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="415" y="93" fill="#93c5fd" font-size="9" font-weight="600">Vỏ thận (Cortex)</text>

  <line x1="350" y1="125" x2="410" y2="120" stroke="#fcd34d" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="415" y="123" fill="#fcd34d" font-size="9" font-weight="600">Đài bể thận</text>

  <!-- Ureters (2 Niệu quản dẫn nước tiểu) -->
  <!-- Right Ureter -->
  <path d="M 163 158 C 170 190, 195 215, 225 235" stroke="#fbbf24" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- Left Ureter -->
  <path d="M 320 152 C 310 185, 285 215, 255 235" stroke="#fbbf24" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  
  <text x="145" y="200" fill="#fde047" font-size="9" font-weight="600">Niệu quản (P)</text>
  <text x="335" y="195" fill="#fde047" font-size="9" font-weight="600">Niệu quản (T)</text>

  <!-- Urinary Bladder (Bàng quang) -->
  <g transform="translate(240, 255)">
    <path d="M -35 -20 C -45 5, -30 25, 0 28 C 30 25, 45 5, 35 -20 C 20 -28, -20 -28, -35 -20 Z" fill="url(#bladderGrad)" stroke="#38bdf8" stroke-width="2"/>
    <text x="0" y="3" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">BÀNG QUANG</text>
    <text x="0" y="16" fill="#bae6fd" font-size="8.5" font-weight="500" text-anchor="middle">Dung tích 300–500ml</text>

    <!-- Urethra (Niệu đạo) -->
    <path d="M 0 28 L 0 38" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <text x="0" y="44" fill="#93c5fd" font-size="8" font-weight="600" text-anchor="middle">Niệu đạo</text>
  </g>
</svg>

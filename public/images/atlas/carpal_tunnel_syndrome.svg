<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradCTS" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071326"/>
      <stop offset="100%" stop-color="#0b2247"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="480" height="300" fill="url(#bgGradCTS)" rx="10"/>

  <!-- Title Badge -->
  <rect x="20" y="16" width="280" height="26" rx="6" fill="#0f2b5c" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="32" y="33" fill="#f8fafc" font-size="12" font-weight="700" font-family="Inter, sans-serif">4 CẤP ĐỘ: HỘI CHỨNG ỐNG CỔ TAY (CTS)</text>

  <rect x="310" y="16" width="150" height="26" rx="6" fill="rgba(30, 64, 175, 0.4)" stroke="#60a5fa" stroke-width="1"/>
  <text x="320" y="33" fill="#93c5fd" font-size="11" font-weight="600" font-family="Inter, sans-serif">Chèn ép Dây TK Giữa</text>

  <!-- 4 Stage Cards Layout -->
  <!-- STAGE 0: Bình thường -->
  <g transform="translate(18, 58)">
    <rect width="105" height="225" rx="8" fill="#0b192e" stroke="#10b981" stroke-width="1.5"/>
    <rect x="6" y="8" width="93" height="20" rx="4" fill="rgba(16, 185, 129, 0.15)"/>
    <text x="52" y="22" fill="#34d399" font-size="9" font-weight="700" text-anchor="middle">CẤP 0: BÌNH THƯỜNG</text>

    <!-- Cross Section of Normal Carpal Tunnel -->
    <!-- Transverse Carpal Ligament (Mạc hãm gân gấp) -->
    <path d="M 20 50 Q 52 42, 85 50" stroke="#38bdf8" stroke-width="3" fill="none"/>
    <path d="M 20 50 Q 52 95, 85 50" stroke="#64748b" stroke-width="2" fill="rgba(15, 23, 42, 0.6)"/>
    
    <!-- Median Nerve (Tròn đều, màu vàng tươi) -->
    <circle cx="52" cy="58" r="7" fill="#facc15" stroke="#ffffff" stroke-width="1"/>
    <!-- 9 Flexor Tendons (Gân cơ gấp) -->
    <circle cx="35" cy="70" r="4" fill="#94a3b8"/>
    <circle cx="46" cy="72" r="4" fill="#94a3b8"/>
    <circle cx="58" cy="72" r="4" fill="#94a3b8"/>
    <circle cx="69" cy="70" r="4" fill="#94a3b8"/>

    <text x="52" y="112" fill="#34d399" font-size="9.5" font-weight="700" text-anchor="middle">Ống thông thoáng</text>
    <text x="52" y="125" fill="#94a3b8" font-size="8" text-anchor="middle">Áp lực &lt; 10 mmHg</text>

    <line x1="12" y1="135" x2="93" y2="135" stroke="#1e293b"/>
    <text x="10" y="152" fill="#cbd5e1" font-size="8">• TK Giữa nguyên vẹn</text>
    <text x="10" y="168" fill="#cbd5e1" font-size="8">• Bao gân trơn láng</text>
    <text x="10" y="184" fill="#cbd5e1" font-size="8">• Cảm giác ngón 1-3 tốt</text>
    <text x="10" y="200" fill="#cbd5e1" font-size="8">• Cơ mô cái đầy đặn</text>
    <text x="10" y="216" fill="#cbd5e1" font-size="8">• Dẫn truyền TK chuẩn</text>
  </g>

  <!-- STAGE 1: Chèn ép nhẹ / Phù nề bao gân -->
  <g transform="translate(131, 58)">
    <rect width="105" height="225" rx="8" fill="#0b192e" stroke="#38bdf8" stroke-width="1.2"/>
    <rect x="6" y="8" width="93" height="20" rx="4" fill="rgba(56, 189, 248, 0.15)"/>
    <text x="52" y="22" fill="#38bdf8" font-size="9" font-weight="700" text-anchor="middle">CẤP 1: TÊ THOÁNG QUA</text>

    <!-- Swollen tendons compressing nerve -->
    <path d="M 20 50 Q 52 42, 85 50" stroke="#38bdf8" stroke-width="3" fill="none"/>
    <path d="M 20 50 Q 52 95, 85 50" stroke="#64748b" stroke-width="2" fill="rgba(15, 23, 42, 0.6)"/>
    
    <!-- Slightly flattened Median Nerve -->
    <ellipse cx="52" cy="57" rx="8" ry="5.5" fill="#facc15" stroke="#f59e0b" stroke-width="1"/>
    <!-- Swollen Tendons (Viêm bao gân) -->
    <circle cx="35" cy="70" r="5" fill="#f87171" opacity="0.8"/>
    <circle cx="46" cy="72" r="5" fill="#f87171" opacity="0.8"/>
    <circle cx="58" cy="72" r="5" fill="#f87171" opacity="0.8"/>
    <circle cx="69" cy="70" r="5" fill="#f87171" opacity="0.8"/>

    <text x="52" y="112" fill="#38bdf8" font-size="9.5" font-weight="700" text-anchor="middle">Phù nề bao gân</text>
    <text x="52" y="125" fill="#94a3b8" font-size="8" text-anchor="middle">Áp lực 20–30 mmHg</text>

    <line x1="12" y1="135" x2="93" y2="135" stroke="#1e293b"/>
    <text x="10" y="152" fill="#cbd5e1" font-size="8">• Tê châm chích ngón 1-3</text>
    <text x="10" y="168" fill="#cbd5e1" font-size="8">• Thường bị về đêm</text>
    <text x="10" y="184" fill="#cbd5e1" font-size="8">• Vẩy tay thấy đỡ</text>
    <text x="10" y="200" fill="#cbd5e1" font-size="8">• Tinel / Phalen (+/-)</text>
    <text x="10" y="216" fill="#cbd5e1" font-size="8">• Chưa teo cơ mô cái</text>
  </g>

  <!-- STAGE 2: Hẹp nặng & Teo cơ mô cái sớm -->
  <g transform="translate(244, 58)">
    <rect width="105" height="225" rx="8" fill="#0b192e" stroke="#f59e0b" stroke-width="1.2"/>
    <rect x="6" y="8" width="93" height="20" rx="4" fill="rgba(245, 158, 11, 0.15)"/>
    <text x="52" y="22" fill="#fbbf24" font-size="9" font-weight="700" text-anchor="middle">CẤP 2: TEO CƠ MÔ CÁI</text>

    <!-- Strongly compressed nerve -->
    <path d="M 20 48 Q 52 38, 85 48" stroke="#f59e0b" stroke-width="3.5" fill="none"/>
    <path d="M 20 48 Q 52 95, 85 48" stroke="#64748b" stroke-width="2" fill="rgba(15, 23, 42, 0.6)"/>
    
    <!-- Squashed Median Nerve (Bị bẹp gí màu đỏ cam) -->
    <ellipse cx="52" cy="55" rx="10" ry="3.5" fill="#f97316" stroke="#ef4444" stroke-width="1.2"/>
    <path d="M 30 70 C 40 78, 65 78, 75 70" fill="#ef4444" opacity="0.6"/>

    <text x="52" y="112" fill="#fbbf24" font-size="9.5" font-weight="700" text-anchor="middle">Thiếu máu cục bộ</text>
    <text x="52" y="125" fill="#fbbf24" font-size="8" text-anchor="middle">Áp lực > 40 mmHg</text>

    <line x1="12" y1="135" x2="93" y2="135" stroke="#1e293b"/>
    <text x="10" y="152" fill="#cbd5e1" font-size="8">• Tê buốt liên tục cả ngày</text>
    <text x="10" y="168" fill="#cbd5e1" font-size="8">• Rơi đũa, rơi chén</text>
    <text x="10" y="184" fill="#cbd5e1" font-size="8">• Teo cơ mô cái ngón cái</text>
    <text x="10" y="200" fill="#cbd5e1" font-size="8">• Test Phalen (+) &lt; 30s</text>
    <text x="10" y="216" fill="#cbd5e1" font-size="8">• Dẫn truyền chậm rõ</text>
  </g>

  <!-- STAGE 3: Mất chức năng (Bàn tay khỉ) -->
  <g transform="translate(357, 58)">
    <rect width="105" height="225" rx="8" fill="#0b192e" stroke="#ef4444" stroke-width="1.8"/>
    <rect x="6" y="8" width="93" height="20" rx="4" fill="rgba(239, 68, 68, 0.2)"/>
    <text x="52" y="22" fill="#f87171" font-size="9" font-weight="700" text-anchor="middle">CẤP 3: BÀN TAY KHỈ</text>

    <!-- Severely compressed, fibrotic, necrotic nerve -->
    <path d="M 20 48 Q 52 35, 85 48" stroke="#ef4444" stroke-width="4" fill="none"/>
    <path d="M 20 48 Q 52 95, 85 48" stroke="#64748b" stroke-width="2" fill="rgba(15, 23, 42, 0.6)"/>
    
    <!-- Crushed Atrophied Nerve (Mất sợi trục thần kinh) -->
    <ellipse cx="52" cy="54" rx="11" ry="2" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5"/>
    <text x="52" y="75" fill="#fca5a5" font-size="7.5" font-weight="700" text-anchor="middle">XƠ HÓA SỢI TRỤC</text>

    <text x="52" y="112" fill="#ef4444" font-size="9.5" font-weight="700" text-anchor="middle">Liệt vận động</text>
    <text x="52" y="125" fill="#f87171" font-size="8" font-weight="700" text-anchor="middle">Mất cảm giác vĩnh viễn</text>

    <line x1="12" y1="135" x2="93" y2="135" stroke="#1e293b"/>
    <text x="10" y="152" fill="#fca5a5" font-size="8">• Teo bẹp gò mô cái</text>
    <text x="10" y="168" fill="#fca5a5" font-size="8">• Bàn tay khỉ (Ape hand)</text>
    <text x="10" y="184" fill="#fca5a5" font-size="8">• Mất đối chiếu ngón cái</text>
    <text x="10" y="200" fill="#fca5a5" font-size="8">• Mất cảm giác ngón 1-3</text>
    <text x="10" y="216" fill="#fca5a5" font-size="8">• Cần phẫu thuật giải phóng</text>
  </g>
</svg>

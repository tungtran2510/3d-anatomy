<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="gipBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#gipBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Title Badge -->
  <g transform="translate(24, 24)">
    <rect width="230" height="26" rx="6" fill="#b91c1c" fill-opacity="0.3" stroke="#ef4444" stroke-width="1" />
    <text x="12" y="17" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11.5" font-weight="700" letter-spacing="0.5">TIẾN TRIỂN BỆNH HỌC TIÊU HÓA</text>
  </g>
  <text x="24" y="70" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="16" font-weight="700">4 Cấp Độ Tổn Thương Niêm Mạc Ống Tiêu Hóa</text>
  <text x="24" y="88" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11.5">Từ niêm mạc bình thường đến viêm trợt, ổ loét ăn sâu cơ và thủng tạng rỗng cấp tính</text>

  <!-- 4 Columns -->
  <!-- Col 1: Cấp 0 -->
  <g transform="translate(24, 115)">
    <rect width="130" height="195" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <rect x="0" y="0" width="130" height="28" rx="8" fill="#065f46" />
    <text x="65" y="18" text-anchor="middle" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="700">CẤP 0: BÌNH THƯỜNG</text>
    
    <!-- Mini Graphic: Intact Mucosa -->
    <rect x="20" y="55" width="90" height="16" rx="3" fill="#34d399"/>
    <rect x="20" y="75" width="90" height="35" rx="3" fill="#fda4af"/>
    
    <text x="10" y="145" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="700">• Màng nhầy liên tục</text>
    <text x="10" y="161" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9.5">• Niêm mạc hồng hào</text>
    <text x="10" y="177" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9.5">• Không đau rát bụng</text>
  </g>

  <!-- Col 2: Cấp 1 -->
  <g transform="translate(164, 115)">
    <rect width="130" height="195" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <rect x="0" y="0" width="130" height="28" rx="8" fill="#92400e" />
    <text x="65" y="18" text-anchor="middle" fill="#fde68a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="700">CẤP 1: VIÊM TRỢT</text>
    
    <!-- Mini Graphic: Eroded Mucus -->
    <path d="M20,55 L55,55 C60,65 70,65 75,55 L110,55" stroke="#f59e0b" stroke-width="5" fill="none"/>
    <rect x="20" y="75" width="90" height="35" rx="3" fill="#fb7185"/>
    <circle cx="65" cy="70" r="4" fill="#ef4444"/>

    <text x="10" y="145" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="700">• Trợt lớp biểu mô</text>
    <text x="10" y="161" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9.5">• Xung huyết phù nề</text>
    <text x="10" y="177" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9.5">• Đầy hơi, ợ chua</text>
  </g>

  <!-- Col 3: Cấp 2 -->
  <g transform="translate(304, 115)">
    <rect width="130" height="195" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="1.5" />
    <rect x="0" y="0" width="130" height="28" rx="8" fill="#9a3412" />
    <text x="65" y="18" text-anchor="middle" fill="#fed7aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="700">CẤP 2: LOÉT SÂU CƠ</text>
    
    <!-- Mini Graphic: Crater Ulcer -->
    <path d="M20,55 L50,55 C55,85 75,85 80,55 L110,55" fill="#991b1b" stroke="#f97316" stroke-width="2"/>
    <rect x="20" y="75" width="90" height="35" rx="3" fill="#e11d48"/>
    <circle cx="65" cy="80" r="6" fill="#7f1d1d"/>

    <text x="10" y="145" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="700">• Ổ loét xuyên qua cơ</text>
    <text x="10" y="161" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9.5">• Cháy máu mao mạch</text>
    <text x="10" y="177" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9.5">• Đau cồn cào đói/no</text>
  </g>

  <!-- Col 4: Cấp 3 -->
  <g transform="translate(444, 115)">
    <rect width="130" height="195" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" />
    <rect x="0" y="0" width="130" height="28" rx="8" fill="#991b1b" />
    <text x="65" y="18" text-anchor="middle" fill="#fecaca" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="700">CẤP 3: BIẾN CHỨNG CẤP</text>
    
    <!-- Mini Graphic: Perforation / Appendicitis rupture -->
    <path d="M20,55 L55,55 L50,110 L80,110 L75,55 L110,55" stroke="#ef4444" stroke-width="3" fill="#450a0a"/>
    <line x1="65" y1="95" x2="65" y2="125" stroke="#ef4444" stroke-width="3" stroke-dasharray="2 2"/>

    <text x="10" y="145" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="700">• Thủng dạ dày tá tràng</text>
    <text x="10" y="161" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9.5">• Viêm ruột thừa vỡ mủ</text>
    <text x="10" y="177" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9.5">• Bụng cứng như gỗ, cấp cứu</text>
  </g>

  <!-- Bottom Insight Bar -->
  <g transform="translate(24, 328)">
    <rect width="552" height="34" rx="7" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="16" y="21" fill="#ef4444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11.5" font-weight="700">CẢNH BÁO CẤP CỨU:</text>
    <text x="160" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11">Nôn ra máu đen hoặc phân đen như bã cà phê là dấu hiệu xuất huyết tiêu hóa nặng cần nhập viện ngay.</text>
  </g>
</svg>

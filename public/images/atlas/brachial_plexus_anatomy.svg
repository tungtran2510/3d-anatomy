<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradPlexus" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071326"/>
      <stop offset="100%" stop-color="#0b2247"/>
    </linearGradient>
    <linearGradient id="nerveGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="480" height="300" fill="url(#bgGradPlexus)" rx="10"/>

  <!-- Title Badge -->
  <rect x="20" y="16" width="240" height="26" rx="6" fill="#0f2b5c" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="32" y="33" fill="#f8fafc" font-size="12" font-weight="700" font-family="Inter, sans-serif">ĐÁM RỐI THẦN KINH CÁNH TAY</text>

  <rect x="270" y="16" width="190" height="26" rx="6" fill="rgba(30, 64, 175, 0.4)" stroke="#60a5fa" stroke-width="1"/>
  <text x="280" y="33" fill="#93c5fd" font-size="11" font-weight="600" font-family="Inter, sans-serif">5 Rễ • 3 Thân • 6 Ngành • 3 Bó</text>

  <!-- Column Header Guide -->
  <g transform="translate(0, 52)">
    <text x="45" y="12" fill="#94a3b8" font-size="9" font-weight="700" text-anchor="middle">5 RỄ (Roots)</text>
    <text x="135" y="12" fill="#94a3b8" font-size="9" font-weight="700" text-anchor="middle">3 THÂN (Trunks)</text>
    <text x="230" y="12" fill="#94a3b8" font-size="9" font-weight="700" text-anchor="middle">6 NGÀNH (Divisions)</text>
    <text x="325" y="12" fill="#94a3b8" font-size="9" font-weight="700" text-anchor="middle">3 BÓ (Cords)</text>
    <text x="420" y="12" fill="#94a3b8" font-size="9" font-weight="700" text-anchor="middle">5 NHÁNH TẬN</text>
  </g>

  <!-- Schematic Diagram of Brachial Plexus Architecture -->
  <g transform="translate(30, 80)">
    <!-- 5 ROOTS -->
    <!-- C5 -->
    <circle cx="15" cy="20" r="5" fill="#facc15"/>
    <text x="5" y="24" fill="#fef08a" font-size="10" font-weight="700" text-anchor="end">C5</text>
    <!-- C6 -->
    <circle cx="15" cy="55" r="5" fill="#facc15"/>
    <text x="5" y="59" fill="#fef08a" font-size="10" font-weight="700" text-anchor="end">C6</text>
    <!-- C7 -->
    <circle cx="15" cy="95" r="5" fill="#facc15"/>
    <text x="5" y="99" fill="#fef08a" font-size="10" font-weight="700" text-anchor="end">C7</text>
    <!-- C8 -->
    <circle cx="15" cy="135" r="5" fill="#facc15"/>
    <text x="5" y="139" fill="#fef08a" font-size="10" font-weight="700" text-anchor="end">C8</text>
    <!-- T1 -->
    <circle cx="15" cy="170" r="5" fill="#facc15"/>
    <text x="5" y="174" fill="#fef08a" font-size="10" font-weight="700" text-anchor="end">T1</text>

    <!-- ROOTS TO 3 TRUNKS -->
    <!-- Superior Trunk (C5 + C6) -->
    <path d="M 15 20 L 60 38" stroke="#facc15" stroke-width="3"/>
    <path d="M 15 55 L 60 38" stroke="#facc15" stroke-width="3"/>
    <path d="M 60 38 L 105 38" stroke="#facc15" stroke-width="4.5"/>
    <text x="105" y="32" fill="#38bdf8" font-size="8.5" font-weight="700">Thân Trên</text>

    <!-- Middle Trunk (C7 continues) -->
    <path d="M 15 95 L 105 95" stroke="#facc15" stroke-width="4"/>
    <text x="105" y="89" fill="#38bdf8" font-size="8.5" font-weight="700">Thân Giữa</text>

    <!-- Inferior Trunk (C8 + T1) -->
    <path d="M 15 135 L 60 152" stroke="#facc15" stroke-width="3"/>
    <path d="M 15 170 L 60 152" stroke="#facc15" stroke-width="3"/>
    <path d="M 60 152 L 105 152" stroke="#facc15" stroke-width="4.5"/>
    <text x="105" y="165" fill="#38bdf8" font-size="8.5" font-weight="700">Thân Dưới</text>

    <!-- 6 DIVISIONS TO 3 CORDS -->
    <!-- Anterior to Lateral Cord (Thân trên -> Bó ngoài) -->
    <path d="M 105 38 L 195 40" stroke="#facc15" stroke-width="3.5"/>
    <!-- Anterior to Lateral Cord (Thân giữa -> Bó ngoài) -->
    <path d="M 105 95 C 135 95, 160 55, 195 45" stroke="#facc15" stroke-width="2.5"/>
    <text x="210" y="32" fill="#f43f5e" font-size="9" font-weight="700">BÓ NGOÀI</text>

    <!-- All Posterior Divisions unite to POSTERIOR CORD -->
    <path d="M 105 38 C 145 45, 155 90, 195 95" stroke="#fde047" stroke-width="2.5" stroke-dasharray="3,2"/>
    <path d="M 105 95 L 195 95" stroke="#fde047" stroke-width="3.5"/>
    <path d="M 105 152 C 145 145, 155 100, 195 95" stroke="#fde047" stroke-width="2.5" stroke-dasharray="3,2"/>
    <text x="210" y="88" fill="#a855f7" font-size="9" font-weight="700">BÓ SAU</text>

    <!-- Anterior to MEDIAL CORD (Thân dưới -> Bó trong) -->
    <path d="M 105 152 L 195 150" stroke="#facc15" stroke-width="4"/>
    <text x="210" y="165" fill="#10b981" font-size="9" font-weight="700">BÓ TRONG</text>

    <!-- 5 TERMINAL BRANCHES (Nhánh tận) -->
    <!-- Musculocutaneous (Từ Bó ngoài) -->
    <path d="M 270 40 L 370 20" stroke="#f43f5e" stroke-width="3"/>
    <text x="375" y="24" fill="#fda4af" font-size="9" font-weight="700">TK Cơ bì</text>

    <!-- Median Nerve (Từ Bó ngoài + Bó trong tạo hình chữ V/M) -->
    <path d="M 270 42 C 300 50, 310 65, 335 75" stroke="#f43f5e" stroke-width="3"/>
    <path d="M 270 148 C 300 135, 310 85, 335 75" stroke="#10b981" stroke-width="3"/>
    <path d="M 335 75 L 370 75" stroke="#facc15" stroke-width="5" stroke-linecap="round"/>
    <text x="375" y="79" fill="#facc15" font-size="10" font-weight="800">DÂY THẦN KINH GIỮA</text>

    <!-- Axillary Nerve (Từ Bó sau) -->
    <path d="M 270 93 L 370 105" stroke="#a855f7" stroke-width="2.5"/>
    <text x="375" y="108" fill="#d8b4fe" font-size="9" font-weight="700">TK Nách</text>

    <!-- Radial Nerve (Từ Bó sau - lớn nhất) -->
    <path d="M 270 97 L 370 132" stroke="#a855f7" stroke-width="4"/>
    <text x="375" y="136" fill="#c084fc" font-size="10" font-weight="800">DÂY THẦN KINH QUAY</text>

    <!-- Ulnar Nerve (Từ Bó trong) -->
    <path d="M 270 152 L 370 175" stroke="#10b981" stroke-width="3.5"/>
    <text x="375" y="179" fill="#6ee7b7" font-size="10" font-weight="800">DÂY THẦN KINH TRỤ</text>
  </g>
</svg>

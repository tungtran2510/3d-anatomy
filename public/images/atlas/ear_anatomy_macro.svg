<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071326"/>
      <stop offset="50%" stop-color="#0b2559"/>
      <stop offset="100%" stop-color="#0f2b5c"/>
    </linearGradient>
    <linearGradient id="auricleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="boneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="cochleaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" fill="url(#bgNavy)" rx="12"/>
  <rect width="596" height="356" x="2" y="2" fill="none" stroke="#1e40af" stroke-width="1.5" stroke-opacity="0.4" rx="10"/>

  <!-- Title Badge -->
  <g transform="translate(24, 20)">
    <rect width="320" height="28" rx="6" fill="#0b2559" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="16" cy="14" r="5" fill="#38bdf8"/>
    <text x="30" y="19" fill="#e8f0fe" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">GIẢI PHẪU TAI NGOÀI - GIỮA - TRONG</text>
    <text x="245" y="18" fill="#38bdf8" font-size="10" font-family="monospace">TA2: 5740</text>
  </g>

  <!-- 3 Main Regions Backdrop Banners -->
  <g transform="translate(30, 58)">
    <!-- Tai ngoài -->
    <rect width="140" height="24" rx="4" fill="#0f172a" stroke="#fb7185" stroke-width="1"/>
    <text x="10" y="16" fill="#fb7185" font-size="10.5" font-weight="bold">1. TAI NGOÀI (Auris ext.)</text>

    <!-- Tai giữa -->
    <rect x="155" width="165" height="24" rx="4" fill="#0f172a" stroke="#eab308" stroke-width="1"/>
    <text x="165" y="16" fill="#facc15" font-size="10.5" font-weight="bold">2. TAI GIỮA (Hòm nhĩ)</text>

    <!-- Tai trong -->
    <rect x="335" width="205" height="24" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="345" y="16" fill="#38bdf8" font-size="10.5" font-weight="bold">3. TAI TRONG (Ốc tai - Tiền đình)</text>
  </g>

  <!-- Diagram Elements -->

  <!-- 1. Vành tai (Auricle / Pinna) -->
  <path d="
    M 35 110 
    C 25 140, 15 190, 30 230
    C 40 250, 60 260, 75 250
    C 70 235, 60 215, 65 190
    C 70 160, 60 130, 45 115
    Z
  " fill="url(#auricleGrad)" stroke="#f43f5e" stroke-width="1.5"/>

  <!-- Ống tai ngoài (Ear Canal / Meatus) -->
  <path d="
    M 65 175 
    C 100 170, 140 180, 185 185
    L 185 205
    C 140 200, 100 195, 70 205
    Z
  " fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <!-- Soundwave arrows entering ear canal -->
  <path d="M 95 188 Q 105 188 115 188 M 125 188 Q 135 188 145 188" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>

  <!-- 2. Màng nhĩ (Tympanic Membrane) -->
  <path d="M 185 175 C 190 190, 188 200, 185 215" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="187" cy="195" rx="3" ry="16" fill="#fecdd3" opacity="0.6"/>

  <!-- 3. Chuỗi xương con (Ossicles: Búa, Đe, Bàn đạp) -->
  <!-- Xương Búa (Malleus - cán búa gắn vào màng nhĩ) -->
  <path d="M 187 190 L 202 165 C 205 160, 212 160, 214 165 C 215 170, 210 175, 204 175 Z" fill="url(#boneGrad)" stroke="#ca8a04" stroke-width="1.2"/>

  <!-- Xương Đe (Incus) -->
  <path d="M 210 165 L 225 168 L 228 185 L 223 186 L 218 175 Z" fill="url(#boneGrad)" stroke="#ca8a04" stroke-width="1.2"/>

  <!-- Xương Bàn đạp (Stapes - gõ vào cửa sổ bầu dục) -->
  <path d="M 228 185 L 245 182 M 228 186 L 245 188 M 245 180 V 190" stroke="#facc15" stroke-width="2" fill="none"/>

  <!-- Vòi nhĩ Eustache (dẫn xuống tỵ hầu) -->
  <path d="M 210 220 C 225 245, 240 275, 260 300" stroke="#94a3b8" stroke-width="5" stroke-dasharray="2,2" stroke-linecap="round"/>

  <!-- 4. Tai trong: Tiền đình, 3 Ống bán khuyên & Ốc tai -->
  <!-- Tiền đình (Vestibule) -->
  <ellipse cx="270" cy="185" rx="14" ry="12" fill="#0e7490" stroke="#22d3ee" stroke-width="1.5"/>

  <!-- 3 Ống bán khuyên (Semicircular Canals) -->
  <!-- Ống trước (Anterior/Superior) -->
  <path d="M 268 175 C 265 140, 290 135, 298 160" stroke="#38bdf8" stroke-width="3" fill="none" filter="url(#glowCyan)"/>
  <!-- Ống sau (Posterior) -->
  <path d="M 275 182 C 305 165, 320 195, 285 195" stroke="#38bdf8" stroke-width="3" fill="none" filter="url(#glowCyan)"/>
  <!-- Ống ngoài / ngang (Lateral) -->
  <path d="M 278 185 C 315 185, 310 205, 275 195" stroke="#06b6d4" stroke-width="2.5" fill="none"/>

  <!-- Ốc tai xoắn 2.5 vòng (Cochlea - Golden Spiral) -->
  <path d="
    M 265 195 
    C 255 215, 270 235, 295 235 
    C 320 235, 335 210, 325 185 
    C 315 165, 290 165, 280 180 
    C 275 195, 290 205, 300 200 
    C 305 195, 302 188, 296 190
  " fill="none" stroke="#22d3ee" stroke-width="3.5" stroke-linecap="round" filter="url(#glowCyan)"/>

  <!-- Dây thần kinh VIII (Vestibulocochlear Nerve) -->
  <path d="M 315 195 C 345 195, 380 200, 420 205" stroke="#facc15" stroke-width="4" stroke-dasharray="6,2"/>
  <path d="M 285 170 C 330 175, 370 190, 420 200" stroke="#facc15" stroke-width="3" stroke-dasharray="6,2"/>

  <!-- Callout Markers & Annotations -->
  <!-- Màng nhĩ -->
  <g transform="translate(145, 120)">
    <rect width="80" height="20" rx="3" fill="#0b2559" stroke="#f43f5e" stroke-width="1"/>
    <text x="6" y="14" fill="#fecdd3" font-size="9.5" font-weight="bold">Màng nhĩ</text>
  </g>
  <line x1="185" y1="140" x2="187" y2="175" stroke="#f43f5e" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Chuỗi xương con -->
  <g transform="translate(195, 95)">
    <rect width="105" height="20" rx="3" fill="#0b2559" stroke="#eab308" stroke-width="1"/>
    <text x="6" y="14" fill="#fef08a" font-size="9.5" font-weight="bold">Chuỗi xương con</text>
  </g>
  <line x1="225" y1="115" x2="225" y2="165" stroke="#eab308" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- 3 Ống bán khuyên -->
  <g transform="translate(310, 105)">
    <rect width="115" height="20" rx="3" fill="#0b2559" stroke="#38bdf8" stroke-width="1"/>
    <text x="6" y="14" fill="#38bdf8" font-size="9.5" font-weight="bold">3 Ống bán khuyên</text>
  </g>
  <line x1="330" y1="125" x2="295" y2="150" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Ốc tai -->
  <g transform="translate(330, 245)">
    <rect width="90" height="20" rx="3" fill="#0b2559" stroke="#22d3ee" stroke-width="1"/>
    <text x="6" y="14" fill="#a5f3fc" font-size="9.5" font-weight="bold">Ốc tai 2.5 vòng</text>
  </g>
  <line x1="340" y1="245" x2="315" y2="225" stroke="#22d3ee" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Dây VIII -->
  <g transform="translate(435, 195)">
    <rect width="145" height="26" rx="4" fill="#0b2559" stroke="#facc15" stroke-width="1"/>
    <text x="8" y="17" fill="#fef08a" font-size="10" font-weight="bold">Dây TK VIII (Tiền đình - Ốc tai)</text>
  </g>

  <!-- Vòi Eustache -->
  <g transform="translate(190, 305)">
    <rect width="125" height="20" rx="3" fill="#0b2559" stroke="#94a3b8" stroke-width="1"/>
    <text x="6" y="14" fill="#cbd5e1" font-size="9.5">Vòi Eustache (Xuống mũi)</text>
  </g>

  <!-- Bottom Medical Note -->
  <g transform="translate(24, 332)">
    <rect width="552" height="22" rx="4" fill="#0b2559" stroke="#1e40af" stroke-width="1"/>
    <text x="12" y="15" fill="#93c5fd" font-size="10.5">💡 Sóng âm: Vành tai → Ống tai → Màng nhĩ rung → Đòn bẩy Xương con khuếch đại 22 lần → Ốc tai → Xung điện Dây VIII</text>
  </g>
</svg>

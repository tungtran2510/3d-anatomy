<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <radialGradient id="nucNormal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </radialGradient>
    <radialGradient id="nucHerniated" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </radialGradient>
  </defs>

  <!-- Background Card -->
  <rect width="600" height="380" rx="16" fill="url(#bgGrad3)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Title Badge -->
  <g transform="translate(24, 26)">
    <rect width="215" height="26" rx="6" fill="#dc2626" fill-opacity="0.25" stroke="#ef4444" stroke-width="1" />
    <text x="12" y="17" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="700" letter-spacing="0.5">BỆNH HỌC LÂM SÀNG</text>
  </g>
  <text x="24" y="72" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="16" font-weight="700">4 Giai Đoạn Tiến Triển Thoát Vị Đĩa Đệm</text>
  <text x="24" y="90" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12">Từ thoái hóa mất nước đến rách vòng sợi chèn ép rễ thần kinh tủy sống</text>

  <!-- 4 Columns Grid -->
  <!-- 1. GIAI ĐOẠN 1: BÌNH THƯỜNG -->
  <g transform="translate(85, 205)">
    <circle cx="0" cy="-35" r="48" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    <circle cx="0" cy="-35" r="38" fill="none" stroke="#2563eb" stroke-dasharray="3 2" />
    <ellipse cx="0" cy="-35" rx="18" ry="14" fill="url(#nucNormal)" stroke="#38bdf8" stroke-width="1.5"/>
    
    <text x="0" y="32" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11.5" font-weight="700" text-anchor="middle">1. Bình thường</text>
    <text x="0" y="47" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" text-anchor="middle">Vòng sợi nguyên vẹn</text>
    <text x="0" y="60" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" text-anchor="middle">Nhân nhầy ở trung tâm</text>
    <rect x="-35" y="70" width="70" height="18" rx="4" fill="#0284c7" fill-opacity="0.2"/>
    <text x="0" y="83" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="8.5" font-weight="700" text-anchor="middle">An toàn</text>
  </g>

  <!-- 2. GIAI ĐOẠN 2: PHÌNH ĐĨA ĐỆM (BULGING) -->
  <g transform="translate(225, 205)">
    <ellipse cx="0" cy="-35" rx="55" ry="46" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
    <ellipse cx="0" cy="-35" rx="42" ry="34" fill="none" stroke="#d97706" stroke-dasharray="3 2" />
    <ellipse cx="6" cy="-35" rx="22" ry="14" fill="#38bdf8" stroke="#f59e0b" stroke-width="1.5"/>
    
    <text x="0" y="32" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11.5" font-weight="700" text-anchor="middle">2. Phình đĩa đệm</text>
    <text x="0" y="47" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" text-anchor="middle">Vòng sợi giãn nở bè</text>
    <text x="0" y="60" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" text-anchor="middle">Nhân nhầy mất nước</text>
    <rect x="-35" y="70" width="70" height="18" rx="4" fill="#d97706" fill-opacity="0.2"/>
    <text x="0" y="83" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="8.5" font-weight="700" text-anchor="middle">Đau mỏi lưng</text>
  </g>

  <!-- 3. GIAI ĐOẠN 3: LỒI ĐĨA ĐỆM (PROTRUSION) -->
  <g transform="translate(365, 205)">
    <!-- Asymmetric bulge -->
    <path d="M-45,-35 C-45,-60 10,-60 45,-35 C55,-10 68,0 48,15 C20,30 -20,30 -45,-35 Z" 
          fill="#1e293b" stroke="#f97316" stroke-width="2" />
    <!-- Inner tear fissure line -->
    <line x1="12" y1="-25" x2="38" y2="-5" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="20" cy="-20" rx="20" ry="15" fill="#f97316" fill-opacity="0.8" stroke="#ea580c" stroke-width="1.5"/>
    
    <text x="0" y="32" fill="#fb923c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11.5" font-weight="700" text-anchor="middle">3. Lồi đĩa đệm</text>
    <text x="0" y="47" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" text-anchor="middle">Rách lá sợi bên trong</text>
    <text x="0" y="60" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" text-anchor="middle">Chưa đứt rách lớp ngoài</text>
    <rect x="-35" y="70" width="70" height="18" rx="4" fill="#ea580c" fill-opacity="0.2"/>
    <text x="0" y="83" fill="#fb923c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="8.5" font-weight="700" text-anchor="middle">Chớm chèn ép</text>
  </g>

  <!-- 4. GIAI ĐOẠN 4: THOÁT VỊ THỰC THỤ (HERNIATION / EXTRUSION) -->
  <g transform="translate(505, 205)">
    <!-- Ruptured outer ring with protruding hernia -->
    <path d="M-45,-35 C-45,-60 10,-60 45,-35 C48,-15 52,-10 70,0 C74,10 60,25 45,15 C20,28 -20,28 -45,-35 Z" 
          fill="#1e293b" stroke="#ef4444" stroke-width="2" />
    <!-- Extruded nucleus pulp -->
    <path d="M15,-20 C35,-10 65,-5 68,2 C70,10 55,20 40,8 C25,-2 10,-10 15,-20 Z" 
          fill="url(#nucHerniated)" stroke="#dc2626" stroke-width="2"/>
    
    <!-- Compressed Nerve (Yellow pinched by Red Hernia) -->
    <circle cx="78" cy="8" r="8" fill="#eab308" stroke="#ca8a04" stroke-width="2"/>
    <text x="78" y="11.5" fill="#713f12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="8" font-weight="900" text-anchor="middle">⚡</text>

    <text x="0" y="32" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11.5" font-weight="700" text-anchor="middle">4. Thoát vị đĩa đệm</text>
    <text x="0" y="47" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" text-anchor="middle">Rách toác vòng sợi</text>
    <text x="0" y="60" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" font-weight="700" text-anchor="middle">Chèn bẹp rễ thần kinh</text>
    <rect x="-42" y="70" width="84" height="18" rx="4" fill="#dc2626" fill-opacity="0.3"/>
    <text x="0" y="83" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="8.5" font-weight="700" text-anchor="middle">Đau thần kinh tọa</text>
  </g>
</svg>
